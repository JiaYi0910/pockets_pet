<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket Hamsters | 倉鼠大莊園 Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="viewport">
    <!-- 頂部 HUD -->
    <div class="top-bar">
      <div class="hud-pill">
        <span>金幣 🪙 <b id="valCoins">200</b></span>
        <span>成員 🐹 <b id="valHamsterCount">1</b></span>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn-pill" onclick="openAdoptCenter()">領養 🏡</button>
        <button class="btn-pill" onclick="openProfile()">手帳 📋</button>
        <button class="btn-pill" id="btnUserStatus" onclick="openAuthModal()">登入 👤</button>
      </div>
    </div>

    <!-- 空間名稱指示與箭頭 -->
    <div class="room-indicator" id="roomIndicatorText">客廳 🛋️</div>
    <button class="room-nav-btn" id="btn-prev-room" onclick="changeRoom(-1)">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="room-nav-btn" id="btn-next-room" onclick="changeRoom(1)">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <div class="build-banner" id="buildBanner">建造模式中：點擊並拖曳家具移動位置</div>

    <!-- 跨房間滑動軌道 -->
    <div id="world-slider">
      <!-- 房間 0: 主客廳 -->
      <div class="room-scene" id="room-living" data-room-index="0">
        <div class="wall-window"><div></div><div></div><div></div><div></div></div>
        <div class="floor"></div>
        <div class="furniture-layer" id="furniture-living"></div>
      </div>

      <!-- 房間 1: 活動室 -->
      <div class="room-scene" id="room-play" data-room-index="1">
        <div class="wall-window" style="left:auto; right:7%;"><div></div><div></div><div></div><div></div></div>
        <div class="floor"></div>
        <div class="furniture-layer" id="furniture-play"></div>
      </div>

      <!-- 房間 2: 露天庭院 -->
      <div class="room-scene" id="room-garden" data-room-index="2">
        <div class="floor"></div>
        <div class="furniture-layer" id="furniture-garden"></div>
      </div>
    </div>

    <!-- 全域倉鼠層 -->
    <div class="hamster-layer" id="hamster-layer"></div>

    <!-- 底部 Dock 工具列 -->
    <div class="dock-wrapper">
      <div class="dock" id="mainDock">
        <button class="dock-btn" onclick="openShop()">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          雜貨鋪
        </button>
        <button class="dock-btn" onclick="openWardrobeSelect()">
          <svg viewBox="0 0 24 24"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          換衣服
        </button>
        <button class="dock-btn" onclick="toggleBuildMode()">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span id="buildBtnText">建造模式</span>
        </button>
        <button class="dock-btn" onclick="showMiniGameIntro()">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="10" r="1"/><circle cx="18" cy="13" r="1"/></svg>
          賺金幣
        </button>
        <button class="dock-btn" onclick="openTravelSelect()">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          旅行手帳
        </button>
      </div>

      <button class="toggle-dock-btn" id="dockToggleBtn" onclick="toggleDock()" title="收合選單">
        <svg viewBox="0 0 24 24">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- 帳號登入/註冊 Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <h3 class="modal-title" id="authTitle">雲端存檔帳號 ☁️</h3>
      <div id="authFormArea">
        <input type="email" class="auth-input" id="authEmail" placeholder="電子信箱 (Email)">
        <input type="password" class="auth-input" id="authPassword" placeholder="密碼 (最少 6 位數)">
        <button class="btn-action" style="background:var(--accent);" onclick="handleAuthLogin()">登入現有帳號</button>
        <button class="btn-action" style="background:#52b788; margin-top:6px;" onclick="handleAuthRegister()">註冊新帳號</button>
      </div>
      <div id="authLoggedInArea" style="display:none; text-align:center;">
        <p style="font-size:13px; color:#555; margin-bottom:12px;">已登入：<b id="currentUserEmail"></b></p>
        <button class="btn-action" style="background:#e63946;" onclick="handleAuthLogout()">登出帳號</button>
      </div>
      <button class="btn-action" style="background:#8b786d; margin-top:8px;" onclick="closeModal('authModal')">關閉</button>
    </div>
  </div>

  <!-- 領養中心 -->
  <div class="modal-overlay" id="adoptModal">
    <div class="modal-card">
      <h3 class="modal-title">倉鼠領養中心 🏡</h3>
      <p style="font-size:12px; text-align:center; color:#888;">金幣餘額：<b id="adoptCoinVal">0</b></p>
      <div class="grid-container" id="adoptGrid"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('adoptModal')">下次再來</button>
    </div>
  </div>

  <!-- 家族手帳 (完整支援改名) -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <h3 class="modal-title">倉鼠家族手帳 📋</h3>
      <div id="hamsterCardList"></div>
      <button class="btn-action" onclick="closeModal('profileModal')">關閉</button>
    </div>
  </div>

  <!-- 換衣服選擇 -->
  <div class="modal-overlay" id="wardrobeSelectModal">
    <div class="modal-card">
      <h3 class="modal-title">選擇要換裝的倉鼠 🧣</h3>
      <div id="wardrobeSelectList"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('wardrobeSelectModal')">取消</button>
    </div>
  </div>

  <!-- 換衣服配件庫 -->
  <div class="modal-overlay" id="wardrobeModal">
    <div class="modal-card">
      <h3 class="modal-title">衣櫥配件庫 👒</h3>
      <p style="font-size:12px; text-align:center; color:var(--accent);">正在為 <b id="wardrobeTargetName"></b> 換裝</p>
      <div class="grid-container" id="wardrobeGrid"></div>
      <button class="btn-action" onclick="closeModal('wardrobeModal')">打扮完成</button>
    </div>
  </div>

  <!-- 雜貨小鋪 -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-card">
      <h3 class="modal-title">森之雜貨鋪 🛒</h3>
      <p style="font-size:12px; text-align:center; color:#888;">金幣餘額：<b id="shopCoinText">0</b></p>
      <div class="grid-container" id="shopGrid"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('shopModal')">離開</button>
    </div>
  </div>

  <!-- 旅行手帳 -->
  <div class="modal-overlay" id="postcardModal">
    <div class="modal-card">
      <h3 class="modal-title">旅行紀念手帳 📖</h3>
      <div style="margin-bottom:10px;">
        <label style="font-size:12px; font-weight:bold; color:var(--main-text);">選擇誰出門散步：</label>
        <select id="selectTraveler" style="width:100%; padding:6px; border-radius:10px; border:1px solid var(--border-color); margin-top:4px; font-size:12px; background:#fff;"></select>
      </div>
      <button class="btn-action" style="margin-bottom:12px; background:var(--accent);" onclick="sendSelectedPetToTravel()">讓牠出發去探險 🎒</button>
      <div style="font-size:12px; font-weight:bold; margin-bottom:6px;">🌸 收集到的明信片 (<span id="postcardCount">0</span>/8)：</div>
      <div id="postcardEmpty" style="font-size:11px; text-align:center; color:#888; padding:8px 0;">還沒有明信片，快派鼠鼠出門吧！</div>
      <div id="postcardList"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('postcardModal')">合上手帳</button>
    </div>
  </div>

  <!-- 小遊戲規則說明 -->
  <div class="modal-overlay" id="rulesModal">
    <div class="modal-card">
      <h3 class="modal-title">接瓜子大作戰 🎮</h3>
      <div style="background:#fff; border:1px solid var(--border-color); border-radius:14px; padding:12px; font-size:12px; line-height:1.7; color:var(--main-text);">
        <p><b>玩法說明：</b>用手指左右拖動接住落下的寶物，限時 20 秒！</p>
        <p style="margin-top:4px;">🪙 <b>金色金幣</b>：+15 分（直接變現）</p>
        <p>🌻 <b>葵花子</b>：+5 分</p>
        <p>🪨 <b>落石</b>：扣 10 分（小心避開！）</p>
      </div>
      <button class="btn-action" style="background:var(--accent);" onclick="reallyStartMiniGame()">開始挑戰！</button>
      <button class="btn-action" style="background:#8b786d; margin-top:6px;" onclick="closeModal('rulesModal')">取消</button>
    </div>
  </div>

  <!-- 小遊戲全螢幕 -->
  <div id="minigame-screen">
    <div class="game-hud">
      <div>金幣得分: <span id="gameScore">0</span></div>
      <div>倒數: <span id="gameTimer">20</span>s</div>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- 引入遊戲主素材與邏輯 -->
  <script src="assets.js"></script>

  <!-- 引入 Firebase 雲端模組 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDdBydWhi8nAK_B0dzuILmdr7WbQZxIiCU",
      authDomain: "pocketpet-387f6.firebaseapp.com",
      projectId: "pocketpet-387f6",
      storageBucket: "pocketpet-387f6.firebasestorage.app",
      messagingSenderId: "94204277326",
      appId: "1:94204277326:web:8e509eee37815049d2891f",
      measurementId: "G-ZWGZHTN32X"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const statusBtn = document.getElementById('btnUserStatus');
      const formArea = document.getElementById('authFormArea');
      const loggedArea = document.getElementById('authLoggedInArea');

      if (user) {
        statusBtn.textContent = '已連線 ☁️';
        formArea.style.display = 'none';
        loggedArea.style.display = 'block';
        document.getElementById('currentUserEmail').textContent = user.email;

        const userDocRef = doc(db, 'saves', user.uid);
        const snap = await getDoc(userDocRef);
        if (snap.exists()) {
          const cloudData = snap.data();
          state.coins = cloudData.coins ?? state.coins;
          state.hamsters = cloudData.hamsters ?? state.hamsters;
          state.inventory = cloudData.inventory ?? state.inventory;
          state.furnitureCoords = cloudData.furnitureCoords ?? state.furnitureCoords;
          state.postcards = cloudData.postcards ?? state.postcards;
          renderHUD();
          renderHamsters();
          renderFurniture();
        } else {
          window.saveGame();
        }
      } else {
        statusBtn.textContent = '登入 👤';
        formArea.style.display = 'block';
        loggedArea.style.display = 'none';
      }
    });

    window.saveGameCloud = async function() {
      if (!currentUser) return;
      try {
        const userDocRef = doc(db, 'saves', currentUser.uid);
        await setDoc(userDocRef, {
          coins: state.coins,
          hamsters: state.hamsters,
          inventory: state.inventory,
          furnitureCoords: state.furnitureCoords,
          postcards: state.postcards
        });
      } catch (err) {
        console.error("雲端存檔失敗:", err);
      }
    };

    window.handleAuthLogin = async () => {
      const em = document.getElementById('authEmail').value;
      const pw = document.getElementById('authPassword').value;
      try {
        await signInWithEmailAndPassword(auth, em, pw);
        window.closeModal('authModal');
        alert('🎉 雲端登入成功！存檔已同步。');
      } catch (e) { alert('登入失敗: ' + e.message); }
    };

    window.handleAuthRegister = async () => {
      const em = document.getElementById('authEmail').value;
      const pw = document.getElementById('authPassword').value;
      try {
        await createUserWithEmailAndPassword(auth, em, pw);
        window.closeModal('authModal');
        alert('🎉 帳號註冊成功！已開啟雲端備份。');
      } catch (e) { alert('註冊失敗: ' + e.message); }
    };

    window.handleAuthLogout = async () => {
      await signOut(auth);
      window.closeModal('authModal');
      alert('已登出帳號。');
    };
  </script>
</body>
</html>
