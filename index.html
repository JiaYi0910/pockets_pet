<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket Hamsters | 倉鼠生活大世界</title>
  <style>
    :root {
      --bg-wall: #fbf8f3;
      --floor-base: #dfceb7;
      --floor-line: #cfbb9f;
      --card-bg: rgba(255, 255, 255, 0.95);
      --main-text: #4a3b32;
      --accent: #d97736;
      --border-color: #ebdccb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: var(--bg-wall);
    }

    #world {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 頂部 HUD */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .hud-pill {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.08);
      display: flex;
      gap: 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--main-text);
      border: 1px solid var(--border-color);
    }
    .btn-pill {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--main-text);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.08);
    }

    /* 房間布景 */
    .wall-window {
      position: absolute;
      top: 10%;
      left: 6%;
      width: 110px;
      height: 135px;
      background: #eef7fc;
      border: 5px solid #fff;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      pointer-events: none;
    }
    .wall-window div { background: rgba(255,255,255,0.45); border-radius: 3px; }
    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 44%;
      background: repeating-linear-gradient(90deg, var(--floor-base) 0px, var(--floor-base) 90px, var(--floor-line) 90px, var(--floor-line) 92px);
      border-top: 6px solid #b8a082;
    }

    .build-banner {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(217, 119, 54, 0.9);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      z-index: 50;
      display: none;
    }
    #world.build-mode .floor {
      background-image: linear-gradient(rgba(217, 119, 54, 0.15) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(217, 119, 54, 0.15) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 家具層 */
    #furniture-layer {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }
    .placed-furniture {
      position: absolute;
      touch-action: none;
      cursor: pointer;
      pointer-events: auto;
      transition: filter 0.2s;
    }
    .placed-furniture.building {
      outline: 2px dashed var(--accent);
      border-radius: 8px;
    }
    .spinning-wheel {
      animation: spinWheel 0.35s linear infinite;
      transform-origin: 50% 50%;
    }
    @keyframes spinWheel { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 倉鼠容器與動作 */
    .hamster-entity {
      position: absolute;
      width: 80px;
      height: 80px;
      z-index: 10;
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out, opacity 0.3s;
    }
    .hamster-entity.held { cursor: grabbing; animation: panicShake 0.12s infinite alternate; }
    .hamster-entity.walking svg.hamster-svg { animation: walkWaddle 0.2s infinite alternate ease-in-out; }
    .hamster-entity.sleeping { opacity: 0.25; filter: blur(0.5px); }
    .hamster-entity.fighting { animation: fightShake 0.08s infinite alternate !important; }

    @keyframes walkWaddle { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
    @keyframes panicShake { from { transform: scale(1.08) rotate(-8deg); } to { transform: scale(1.08) rotate(8deg); } }
    @keyframes fightShake { from { transform: translate(-4px, -2px) scale(1.1); } to { transform: translate(4px, 2px) scale(1.1); } }

    .hamster-hat-slot {
      position: absolute;
      top: -14px;
      width: 48px;
      height: 32px;
      z-index: 12;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .gender-badge {
      position: absolute;
      bottom: -6px;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      color: #fff;
      font-weight: bold;
    }
    .badge-male { background: #3a86ff; }
    .badge-female { background: #ff006e; }

    /* 食物與特效 */
    .sunflower-seed {
      position: absolute;
      width: 16px;
      height: 24px;
      background: #3e3228;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 2px solid #5a4b3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      pointer-events: none;
      z-index: 5;
      animation: seedDrop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .sunflower-seed::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 3px;
      width: 3px;
      height: 14px;
      background: #fdfbf7;
      border-radius: 3px;
      opacity: 0.8;
    }
    @keyframes seedDrop {
      0% { transform: translateY(-30px) scale(0.4); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .action-bubble {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-36px) scale(1.2); }
    }

    /* 底部收合 Dock */
    .dock-wrapper {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 14px) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dock {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 8px 14px;
      border-radius: 26px;
      box-shadow: 0 8px 24px rgba(74, 59, 50, 0.12);
      display: flex;
      gap: 10px;
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dock.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8) translateY(20px);
      position: absolute;
    }
    .dock-btn {
      background: transparent;
      border: none;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--main-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dock-btn svg { width: 22px; height: 22px; stroke: var(--main-text); stroke-width: 2; fill: none; }
    .dock-btn:active { transform: scale(0.92); }

    .toggle-dock-btn {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--main-text);
      font-size: 13px;
      font-weight: bold;
    }

    /* 彈窗 UI */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 35, 30, 0.5);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: #fdfaf6;
      padding: 22px;
      border-radius: 24px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 84vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 17px; color: var(--main-text); margin-bottom: 14px; text-align: center; }
    .btn-action {
      background: var(--main-text);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .card-item {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--main-text);
    }
    .preview-box {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 小遊戲全螢幕 */
    #minigame-screen {
      position: fixed;
      inset: 0;
      background: #fbf6ee;
      z-index: 150;
      display: none;
    }
    #game-canvas { width: 100%; height: 100%; }
    .game-hud {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      color: var(--main-text);
    }
  </style>
</head>
<body>

  <div id="world">
    <!-- 頂部 HUD -->
    <div class="top-bar">
      <div class="hud-pill">
        <span>金幣 🪙 <b id="valCoins">180</b></span>
        <span>成員 🐹 <b id="valHamsterCount">1</b>隻</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-pill" onclick="openAdoptCenter()">領養中心 🏡</button>
        <button class="btn-pill" onclick="openProfile()">鼠鼠家族 📋</button>
      </div>
    </div>

    <div class="build-banner" id="buildBanner">建造模式中：點擊並拖曳家具移動位置</div>

    <!-- 房間與家具 -->
    <div class="wall-window"><div></div><div></div><div></div><div></div></div>
    <div class="floor"></div>
    <div id="furniture-layer"></div>

    <!-- 倉鼠活動層 -->
    <div id="hamster-layer"></div>

    <!-- 底部 Dock -->
    <div class="dock-wrapper">
      <div class="dock" id="mainDock">
        <button class="dock-btn" onclick="openShop()">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          雜貨鋪
        </button>
        <button class="dock-btn" onclick="openWardrobeSelect()">
          <svg viewBox="0 0 24 24"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          換衣服
        </button>
        <button class="dock-btn" onclick="toggleBuildMode()">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span id="buildBtnText">建造模式</span>
        </button>
        <button class="dock-btn" onclick="showMiniGameIntro()">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="10" r="1"/><circle cx="18" cy="13" r="1"/></svg>
          賺金幣
        </button>
        <button class="dock-btn" onclick="openTravelSelect()">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          旅行手帳
        </button>
      </div>
      <button class="toggle-dock-btn" id="dockToggleBtn" onclick="toggleDock()">收</button>
    </div>
  </div>

  <!-- 領養中心 -->
  <div class="modal-overlay" id="adoptModal">
    <div class="modal-card">
      <h3 class="modal-title">倉鼠領養中心 🏡</h3>
      <p style="font-size:12px; text-align:center; color:#888;">金幣餘額：<b id="adoptCoinVal">0</b></p>
      <div class="grid-container" id="adoptGrid"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('adoptModal')">下次再來</button>
    </div>
  </div>

  <!-- 家族手帳 -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <h3 class="modal-title">倉鼠家族手帳 📋</h3>
      <div id="hamsterCardList"></div>
      <button class="btn-action" onclick="closeModal('profileModal')">關閉</button>
    </div>
  </div>

  <!-- 換裝選鼠 -->
  <div class="modal-overlay" id="wardrobeSelectModal">
    <div class="modal-card">
      <h3 class="modal-title">選擇要換裝的倉鼠 🧣</h3>
      <div id="wardrobeSelectList"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('wardrobeSelectModal')">取消</button>
    </div>
  </div>

  <!-- 換衣服衣櫥 -->
  <div class="modal-overlay" id="wardrobeModal">
    <div class="modal-card">
      <h3 class="modal-title">衣櫥配件庫 👒</h3>
      <p style="font-size:12px; text-align:center; color:var(--accent);">正在為 <b id="wardrobeTargetName"></b> 換裝</p>
      <div class="grid-container" id="wardrobeGrid"></div>
      <button class="btn-action" onclick="closeModal('wardrobeModal')">打扮完成</button>
    </div>
  </div>

  <!-- 雜貨小鋪 (大量全新物品) -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-card">
      <h3 class="modal-title">森之雜貨鋪 🛒</h3>
      <p style="font-size:12px; text-align:center; color:#888;">金幣餘額：<b id="shopCoinText">0</b></p>
      <div class="grid-container" id="shopGrid"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('shopModal')">離開</button>
    </div>
  </div>

  <!-- 8 景點旅行紀念手帳 -->
  <div class="modal-overlay" id="postcardModal">
    <div class="modal-card">
      <h3 class="modal-title">旅行紀念手帳 📖</h3>
      <div style="margin-bottom:12px;">
        <label style="font-size:13px; font-weight:bold; color:var(--main-text);">選擇誰出門散步：</label>
        <select id="selectTraveler" style="width:100%; padding:8px; border-radius:12px; border:1px solid var(--border-color); margin-top:6px; font-size:13px; background:#fff;"></select>
      </div>
      <button class="btn-action" style="margin-bottom:14px; background:var(--accent);" onclick="sendSelectedPetToTravel()">讓牠出發去探險 🎒</button>
      
      <div style="font-size:13px; font-weight:bold; margin-bottom:8px;">🌸 收集到的明信片 (<span id="postcardCount">0</span>/8)：</div>
      <div id="postcardEmpty" style="font-size:12px; text-align:center; color:#888; padding:10px 0;">還沒有明信片，快派鼠鼠出門吧！</div>
      <div id="postcardList"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('postcardModal')">合上手帳</button>
    </div>
  </div>

  <!-- 小遊戲規則說明 -->
  <div class="modal-overlay" id="rulesModal">
    <div class="modal-card">
      <h3 class="modal-title">接瓜子大作戰 🎮</h3>
      <div style="background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:14px; font-size:13px; line-height:1.8; color:var(--main-text);">
        <p><b>規則玩法：</b>滑動手指接住落下的寶物，限時 20 秒！</p>
        <p style="margin-top:6px;">🪙 <b>金色金幣</b>：+15 分（直接變現）</p>
        <p>🌻 <b>葵花子</b>：+5 分</p>
        <p>🪨 <b>落石</b>：扣 10 分（注意閃躲！）</p>
      </div>
      <button class="btn-action" style="background:var(--accent);" onclick="reallyStartMiniGame()">開始挑戰！</button>
      <button class="btn-action" style="background:#8b786d; margin-top:6px;" onclick="closeModal('rulesModal')">取消</button>
    </div>
  </div>

  <!-- 小遊戲畫布 -->
  <div id="minigame-screen">
    <div class="game-hud">
      <div>金幣得分: <span id="gameScore">0</span></div>
      <div>倒數: <span id="gameTimer">20</span>s</div>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <script>
    // 品種定義
    const SPECIES = {
      golden: { name: '金絲熊', cost: 0, body: '#e8a86b', belly: '#fffdfa', ear: '#f4b7a1' },
      silver: { name: '銀狐鼠', cost: 100, body: '#e9ecef', belly: '#ffffff', ear: '#adb5bd' },
      bear: { name: '黑熊鼠', cost: 150, body: '#495057', belly: '#ced4da', ear: '#343a40' },
      pudding: { name: '布丁鼠', cost: 180, body: '#ffd166', belly: '#fff3b0', ear: '#f4a261' }
    };

    function generateHamsterSVG(speciesKey) {
      const s = SPECIES[speciesKey] || SPECIES.golden;
      return `<svg class="hamster-svg" viewBox="0 0 100 100" width="80" height="80">
        <circle cx="15" cy="65" r="7" fill="${s.ear}" />
        <ellipse cx="50" cy="60" rx="36" ry="32" fill="${s.body}" />
        <ellipse cx="52" cy="68" rx="24" ry="20" fill="${s.belly}" />
        <circle cx="30" cy="28" r="10" fill="${s.body}" />
        <circle cx="30" cy="28" r="6" fill="${s.ear}" />
        <circle cx="70" cy="28" r="10" fill="${s.body}" />
        <circle cx="70" cy="28" r="6" fill="${s.ear}" />
        <circle cx="40" cy="46" r="4.5" fill="#2d2013" />
        <circle cx="38.5" cy="44.5" r="1.5" fill="#fff" />
        <circle cx="62" cy="46" r="4.5" fill="#2d2013" />
        <circle cx="60.5" cy="44.5" r="1.5" fill="#fff" />
        <circle cx="32" cy="54" r="5" fill="#f79d84" opacity="0.6" />
        <circle cx="70" cy="54" r="5" fill="#f79d84" opacity="0.6" />
        <polygon points="51,52 48,49 54,49" fill="#df7a6b" />
        <path d="M47 55 Q51 58 55 55" stroke="#4a3b32" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <ellipse cx="40" cy="64" rx="4.5" ry="6" fill="${s.belly}" />
        <ellipse cx="62" cy="64" rx="4.5" ry="6" fill="${s.belly}" />
      </svg>`;
    }

    // 大量手繪向量圖庫（8 帽子、7 家具、8 明信片）
    const ASSETS = {
      hats: {
        straw_hat: { name: '夏日草帽', cost: 30, svg: `<svg viewBox="0 0 60 40" width="46" height="30"><path d="M5 28 Q30 22 55 28 Q30 34 5 28" fill="#e9c46a" stroke="#d4a373" stroke-width="2"/><ellipse cx="30" cy="20" rx="16" ry="12" fill="#f4a261"/><rect x="14" y="20" width="32" height="4" fill="#e76f51"/></svg>` },
        pink_bow: { name: '粉櫻蝴蝶結', cost: 45, svg: `<svg viewBox="0 0 50 35" width="40" height="28"><polygon points="25,18 10,8 10,28" fill="#f4a5ae"/><polygon points="25,18 40,8 40,28" fill="#f4a5ae"/><ellipse cx="25" cy="18" rx="5" ry="5" fill="#e56b81"/></svg>` },
        grad_cap: { name: '學士帽', cost: 70, svg: `<svg viewBox="0 0 60 40" width="46" height="30"><polygon points="30,8 54,18 30,28 6,18" fill="#2b2d42"/><rect x="22" y="24" width="16" height="8" fill="#1d1e2c"/><path d="M48 20 L48 30" stroke="#f4a261" stroke-width="2"/><circle cx="48" cy="31" r="2" fill="#f4a261"/></svg>` },

      }
    };

    // 狀態持久化
    const STORAGE_KEY = 'pocket_hamster_save_v6';
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { saved = {}; }

    const state = {
      coins: saved.coins ?? 180,
      hamsters: saved.hamsters || [
        { id: 'h_1', name: '泡泡', gender: '♂', species: 'golden', feedCount: 22, equippedHat: 'straw_hat', x: 80, y: window.innerHeight * 0.70 }
      ],
      inventory: saved.inventory || ['straw_hat', 'wheel', 'mushroom_house', 'water_bottle'],
      furnitureCoords: saved.furnitureCoords || {
        wheel: { x: 25, y: window.innerHeight * 0.58 },
        mushroom_house: { x: window.innerWidth - 150, y: window.innerHeight * 0.58 },
        water_bottle: { x: 170, y: window.innerHeight * 0.55 }
      },
      postcards: saved.postcards || [],
      isBuilding: false,
      travelingIds: [],
      wardrobeTargetId: null,
      furnitureOccupant: {} // 記錄家具當前被哪隻鼠佔用：{ wheel: 'h_1', ... }
    };

    function saveGame() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        coins: state.coins,
        hamsters: state.hamsters,
        inventory: state.inventory,
        furnitureCoords: state.furnitureCoords,
        postcards: state.postcards
      }));
    }

    const world = document.getElementById('world');
    const furnitureLayer = document.getElementById('furniture-layer');
    const hamsterLayer = document.getElementById('hamster-layer');

    // 1. 倉鼠實體渲染
    function renderHamsters() {
      hamsterLayer.innerHTML = '';
      state.hamsters.forEach(h => {
        if (state.travelingIds.includes(h.id)) return;

        const wrap = document.createElement('div');
        wrap.className = 'hamster-entity';
        wrap.id = `entity-${h.id}`;
        wrap.style.left = `${h.x}px`;
        wrap.style.top = `${h.y}px`;

        const scale = h.feedCount < 10 ? 0.75 : (h.feedCount < 20 ? 0.95 : 1.22);
        wrap.style.transform = `scale(${scale})`;

        const hatSlot = document.createElement('div');
        hatSlot.className = 'hamster-hat-slot';
        if (h.equippedHat && ASSETS.hats[h.equippedHat]) {
          hatSlot.innerHTML = ASSETS.hats[h.equippedHat].svg;
        }
        wrap.appendChild(hatSlot);
        wrap.insertAdjacentHTML('beforeend', generateHamsterSVG(h.species));

        const genderBadge = document.createElement('div');
        genderBadge.className = `gender-badge ${h.gender === '♂' ? 'badge-male' : 'badge-female'}`;
        genderBadge.textContent = `${h.name} ${h.gender}`;
        wrap.appendChild(genderBadge);

        let isHeld = false, dOffset = { x: 0, y: 0 };
        wrap.addEventListener('pointerdown', (e) => {
          if (state.isBuilding) return;
          isHeld = true;
          wrap.classList.add('held');
          dOffset.x = e.clientX - h.x;
          dOffset.y = e.clientY - h.y;
          wrap.setPointerCapture(e.pointerId);
        });
        wrap.addEventListener('pointermove', (e) => {
          if (!isHeld) return;
          h.x = Math.max(15, Math.min(window.innerWidth - 95, e.clientX - dOffset.x));
          h.y = Math.max(window.innerHeight * 0.56, Math.min(window.innerHeight * 0.78, e.clientY - dOffset.y));
          wrap.style.left = `${h.x}px`;
          wrap.style.top = `${h.y}px`;
        });
        wrap.addEventListener('pointerup', () => {
          if (!isHeld) return;
          isHeld = false;
          wrap.classList.remove('held');
          h.y = window.innerHeight * 0.70;
          wrap.style.top = `${h.y}px`;
          checkProximityAndMate(h);
          saveGame();
        });

        hamsterLayer.appendChild(wrap);
      });
    }

    // 2. 家具渲染
    function renderFurniture() {
      furnitureLayer.innerHTML = '';
      Object.keys(state.furnitureCoords).forEach(id => {
        const item = ASSETS.furniture[id];
        if (!item) return;

        const coords = state.furnitureCoords[id];
        const el = document.createElement('div');
        el.className = `placed-furniture ${state.isBuilding ? 'building' : ''}`;
        el.id = `furni-${id}`;
        el.innerHTML = item.svg;
        el.style.left = `${coords.x}px`;
        el.style.top = `${coords.y}px`;

        if (state.isBuilding) {
          let fDrag = false, fOffset = { x: 0, y: 0 };
          el.addEventListener('pointerdown', (e) => {
            fDrag = true;
            fOffset.x = e.clientX - coords.x;
            fOffset.y = e.clientY - coords.y;
            el.setPointerCapture(e.pointerId);
          });
          el.addEventListener('pointermove', (e) => {
            if (!fDrag) return;
            coords.x = e.clientX - fOffset.x;
            coords.y = Math.max(window.innerHeight * 0.50, Math.min(window.innerHeight * 0.80, e.clientY - fOffset.y));
            el.style.left = `${coords.x}px`;
            el.style.top = `${coords.y}px`;
          });
          el.addEventListener('pointerup', () => { fDrag = false; saveGame(); });
        }
        furnitureLayer.appendChild(el);
      });
    }

    // 3. 家具搶奪打架系統與互斥機制
    function triggerDuel(furniId, userA, userB, onDone) {
      const wrapA = document.getElementById(`entity-${userA.id}`);
      const wrapB = document.getElementById(`entity-${userB.id}`);
      if (!wrapA || !wrapB) return;

      wrapA.classList.add('fighting');
      wrapB.classList.add('fighting');
      spawnBubble('💢', userA.x + 20, userA.y - 20);
      spawnBubble('💥', userB.x + 20, userB.y - 20);

      setTimeout(() => {
        wrapA.classList.remove('fighting');
        wrapB.classList.remove('fighting');

        // 隨機決定勝負（體型大有微小優勢）
        const winA = (userA.feedCount + Math.random() * 20) >= (userB.feedCount + Math.random() * 20);
        const winner = winA ? userA : userB;
        const loser = winA ? userB : userA;
        const loserWrap = document.getElementById(`entity-${loser.id}`);

        // 輸家被彈開哭泣
        spawnBubble('🥺', loser.x + 25, loser.y - 15);
        walkTo(loser, loserWrap, loser.x + (winA ? 60 : -60), window.innerHeight * 0.72);

        // 贏家順利佔領
        state.furnitureOccupant[furniId] = winner.id;
        spawnBubble('👑', winner.x + 25, winner.y - 20);
        if (onDone) onDone(winner);
      }, 1600);
    }

    // 4. 自主活動與家具使用感知
    setInterval(() => {
      if (state.isBuilding) return;

      state.hamsters.forEach(h => {
        if (state.travelingIds.includes(h.id)) return;
        const wrap = document.getElementById(`entity-${h.id}`);
        if (!wrap || wrap.classList.contains('held') || wrap.classList.contains('fighting')) return;

        const keys = Object.keys(state.furnitureCoords);
        if (keys.length === 0) return;

        // 70% 機率去互動家具，30% 機率閒晃
        if (Math.random() < 0.7) {
          const targetFurni = keys[Math.floor(Math.random() * keys.length)];
          const fCoords = state.furnitureCoords[targetFurni];

          walkTo(h, wrap, fCoords.x + 20, fCoords.y + 20, () => {
            const currentOccupantId = state.furnitureOccupant[targetFurni];
            
            // 如果家具已經有別的鼠在用，觸發打架爭奪！
            if (currentOccupantId && currentOccupantId !== h.id) {
              const otherHamster = state.hamsters.find(item => item.id === currentOccupantId);
              if (otherHamster) {
                triggerDuel(targetFurni, otherHamster, h, (winner) => {
                  useFurniture(targetFurni, winner);
                });
                return;
              }
            }

            // 無人使用，直接佔用
            state.furnitureOccupant[targetFurni] = h.id;
            useFurniture(targetFurni, h);
          });
        } else {
          const destX = Math.random() * (window.innerWidth - 120) + 40;
          walkTo(h, wrap, destX, window.innerHeight * 0.70, () => {
            checkProximityAndMate(h);
          });
        }
      });
    }, 6500);

    function useFurniture(furniId, h) {
      const wrap = document.getElementById(`entity-${h.id}`);
      if (!wrap) return;

      if (furniId === 'wheel') {
        const rotor = document.getElementById('wheel-rotor');
        if (rotor) rotor.classList.add('spinning-wheel');
        spawnBubble('⚡', h.x + 30, h.y - 15);
        state.coins += 2;
        renderHUD();
        setTimeout(() => {
          if (rotor) rotor.classList.remove('spinning-wheel');
          if (state.furnitureOccupant['wheel'] === h.id) delete state.furnitureOccupant['wheel'];
        }, 3800);
      } else if (furniId === 'mushroom_house') {
        wrap.classList.add('sleeping');
        spawnBubble('💤', h.x + 30, h.y - 15);
        setTimeout(() => {
          wrap.classList.remove('sleeping');
          if (state.furnitureOccupant['mushroom_house'] === h.id) delete state.furnitureOccupant['mushroom_house'];
        }, 4500);
      } else if (furniId === 'water_bottle') {
        spawnBubble('💧', h.x + 30, h.y - 15);
        setTimeout(() => {
          if (state.furnitureOccupant['water_bottle'] === h.id) delete state.furnitureOccupant['water_bottle'];
        }, 2500);
      } else {
        spawnBubble('✨', h.x + 30, h.y - 15);
        setTimeout(() => {
          if (state.furnitureOccupant[furniId] === h.id) delete state.furnitureOccupant[furniId];
        }, 3000);
      }
    }

    function walkTo(h, el, targetX, targetY, onArrival) {
      if (!el) return;
      el.classList.add('walking');
      const startX = h.x;
      const startY = h.y;
      let p = 0;
      const step = () => {
        if (el.classList.contains('held') || el.classList.contains('fighting') || state.isBuilding) {
          el.classList.remove('walking');
          return;
        }
        p += 0.025;
        h.x = startX + (targetX - startX) * p;
        h.y = startY + (targetY - startY) * p;
        el.style.left = `${h.x}px`;
        el.style.top = `${h.y}px`;
        if (p < 1) requestAnimationFrame(step);
        else {
          el.classList.remove('walking');
          if (onArrival) onArrival();
        }
      };
      requestAnimationFrame(step);
    }

    // 5. 繁殖交配
    let isBreeding = false;
    function checkProximityAndMate(hamsterA) {
      if (isBreeding || hamsterA.feedCount < 20) return;

      state.hamsters.forEach(hamsterB => {
        if (hamsterA.id === hamsterB.id || hamsterB.feedCount < 20) return;
        if (hamsterA.gender === hamsterB.gender) return;

        const dist = Math.hypot(hamsterA.x - hamsterB.x, hamsterA.y - hamsterB.y);
        if (dist < 40) {
          triggerBreeding(hamsterA, hamsterB);
        }
      });
    }

    function triggerBreeding(father, mother) {
      isBreeding = true;
      const male = father.gender === '♂' ? father : mother;
      const female = father.gender === '♀' ? father : mother;

      spawnBubble('💖', male.x + 30, male.y - 20);
      spawnBubble('💖', female.x + 30, female.y - 20);

      setTimeout(() => {
        const babyGender = Math.random() < 0.5 ? '♂' : '♀';
        const babySpecies = Math.random() < 0.5 ? male.species : female.species;
        const babyName = `小${babySpecies === 'golden' ? '金' : (babySpecies === 'silver' ? '銀' : (babySpecies === 'pudding' ? '布' : '黑'))}`;
        
        state.hamsters.push({
          id: `h_${Date.now()}`,
          name: babyName,
          gender: babyGender,
          species: babySpecies,
          feedCount: 0,
          equippedHat: null,
          x: female.x + 30,
          y: female.y
        });
        saveGame();
        renderHamsters();
        renderHUD();
        isBreeding = false;
        alert(`🎉 恭喜！${male.name}(♂) 與 ${female.name}(♀) 誕下了幼鼠：【${babyName} (${babyGender})】！`);
      }, 3000);
    }

    // 點地板丟瓜子
    world.addEventListener('pointerdown', (e) => {
      if (state.isBuilding || state.travelingIds.length === state.hamsters.length) return;
      if (e.clientY < 90 || e.clientY > window.innerHeight - 80) return;
      dropSeed(e.clientX - 8, e.clientY - 12);
    });

    function dropSeed(x, y) {
      const seed = document.createElement('div');
      seed.className = 'sunflower-seed';
      seed.style.left = `${x}px`;
      seed.style.top = `${y}px`;
      world.appendChild(seed);

      let closest = null, minDist = Infinity;
      state.hamsters.forEach(h => {
        if (state.travelingIds.includes(h.id)) return;
        const d = Math.hypot(h.x - x, h.y - y);
        if (d < minDist) { minDist = d; closest = h; }
      });
      if (!closest) return;

      const wrap = document.getElementById(`entity-${closest.id}`);
      if (!wrap) return;
      walkTo(closest, wrap, x - 35, y - 10, () => {
        seed.remove();
        closest.feedCount++;
        saveGame();
        renderHamsters();
        spawnBubble('😋', closest.x + 35, closest.y);
      });
    }

    function spawnBubble(emoji, x, y) {
      const b = document.createElement('div');
      b.className = 'action-bubble';
      b.textContent = emoji;
      b.style.left = `${x}px`;
      b.style.top = `${y}px`;
      world.appendChild(b);
      setTimeout(() => b.remove(), 800);
    }

    // 6. 領養中心
    function openAdoptCenter() {
      document.getElementById('adoptCoinVal').textContent = state.coins;
      const grid = document.getElementById('adoptGrid');
      grid.innerHTML = '';
      Object.keys(SPECIES).forEach(key => {
        const sp = SPECIES[key];
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="preview-box">${generateHamsterSVG(key)}</div>
          <b>${sp.name}</b>
          <span>🪙 ${sp.cost === 0 ? '免費' : sp.cost + ' 幣'}</span>
        `;
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.style.cssText = 'padding:6px; margin-top:4px;';
        btn.textContent = '領養';
        btn.onclick = () => {
          if (state.coins < sp.cost) return alert('金幣不夠了！');
          const n = prompt(`為【${sp.name}】取個名字：`, sp.name);
          if (!n || !n.trim()) return;
          state.coins -= sp.cost;
          const assignedGender = Math.random() < 0.5 ? '♂' : '♀';
          state.hamsters.push({
            id: `h_${Date.now()}`,
            name: n.trim(),
            gender: assignedGender,
            species: key,
            feedCount: 0,
            equippedHat: null,
            x: window.innerWidth / 2 - 40,
            y: window.innerHeight * 0.70
          });
          saveGame();
          renderHamsters();
          renderHUD();
          closeModal('adoptModal');
          alert(`恭喜領養成功！這是一隻 ${assignedGender === '♂' ? '小男生 ♂' : '小女生 ♀'}！`);
        };
        card.appendChild(btn);
        grid.appendChild(card);
      });
      document.getElementById('adoptModal').style.display = 'flex';
    }

    // 7. 家族手帳
    function openProfile() {
      const list = document.getElementById('hamsterCardList');
      list.innerHTML = '';
      state.hamsters.forEach(h => {
        const sp = SPECIES[h.species] || SPECIES.golden;
        const stage = h.feedCount < 10 ? '幼鼠期 🌱' : (h.feedCount < 20 ? '亞成體 🌾' : '成熟可繁育 🌻');
        const box = document.createElement('div');
        box.style.cssText = 'background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:12px; margin-bottom:10px; font-size:13px; line-height:1.6; display:flex; align-items:center; gap:12px;';
        box.innerHTML = `
          <div style="flex-shrink:0;">${generateHamsterSVG(h.species)}</div>
          <div style="flex-grow:1;">
            <div><b>${h.name}</b> <span style="font-weight:bold; color:${h.gender==='♂'?'#3a86ff':'#ff006e'};">${h.gender}</span></div>
            <div>品種：${sp.name}</div>
            <div>狀態：${stage} (嗑瓜子 ${h.feedCount} 顆)</div>
          </div>
        `;
        list.appendChild(box);
      });
      document.getElementById('profileModal').style.display = 'flex';
    }

    // 8. 換衣服系統
    function openWardrobeSelect() {
      const list = document.getElementById('wardrobeSelectList');
      list.innerHTML = '';
      state.hamsters.forEach(h => {
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; background:#fff; color:var(--main-text); border:1px solid var(--border-color);';
        btn.innerHTML = `<span>${h.name} (${h.gender})</span> <span>戴著：${h.equippedHat ? ASSETS.hats[h.equippedHat].name : '無'} 👒</span>`;
        btn.onclick = () => {
          state.wardrobeTargetId = h.id;
          closeModal('wardrobeSelectModal');
          openWardrobeActual(h);
        };
        list.appendChild(btn);
      });
      document.getElementById('wardrobeSelectModal').style.display = 'flex';
    }

    function openWardrobeActual(hamster) {
      document.getElementById('wardrobeTargetName').textContent = `${hamster.name} (${hamster.gender})`;
      const grid = document.getElementById('wardrobeGrid');
      grid.innerHTML = '';
      const hatIds = state.inventory.filter(id => ASSETS.hats[id]);

      hatIds.forEach(id => {
        const item = ASSETS.hats[id];
        const isEquipped = hamster.equippedHat === id;
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="preview-box">${item.svg}</div>
          <b>${item.name}</b>
          <button class="btn-action" style="padding:6px; margin-top:4px;" onclick="toggleHatForCurrent('${id}')">
            ${isEquipped ? '卸下' : '穿上'}
          </button>
        `;
        grid.appendChild(card);
      });
      document.getElementById('wardrobeModal').style.display = 'flex';
    }

    function toggleHatForCurrent(hatId) {
      const h = state.hamsters.find(item => item.id === state.wardrobeTargetId);
      if (!h) return;
      h.equippedHat = (h.equippedHat === hatId) ? null : hatId;
      saveGame();
      renderHamsters();
      openWardrobeActual(h);
    }

    // 9. 散步與明信片手帳 (8款景點)
    function openTravelSelect() {
      const sel = document.getElementById('selectTraveler');
      sel.innerHTML = '';
      state.hamsters.forEach(h => {
        const opt = document.createElement('option');
        opt.value = h.id;
        opt.textContent = `${h.name} (${h.gender}) - ${SPECIES[h.species].name}`;
        sel.appendChild(opt);
      });
      renderPostcardList();
      document.getElementById('postcardModal').style.display = 'flex';
    }

    function sendSelectedPetToTravel() {
      const sel = document.getElementById('selectTraveler');
      const targetId = sel.value;
      const traveler = state.hamsters.find(h => h.id === targetId);
      if (!traveler) return;

      if (state.travelingIds.includes(targetId)) return alert('牠已經在散步路上囉！');

      state.travelingIds.push(targetId);
      closeModal('postcardModal');
      renderHamsters();
      alert(`${traveler.name} 背起書包出發探險了！大約 8 秒後帶明信片回來～`);

      setTimeout(() => {
        state.travelingIds = state.travelingIds.filter(id => id !== targetId);
        renderHamsters();

        const keys = Object.keys(ASSETS.postcards);
        // 優先抽選未解鎖的景點
        const uncollectedKeys = keys.filter(k => !state.postcards.some(p => p.title === ASSETS.postcards[k].title));
        const chosenKey = uncollectedKeys.length > 0 ? uncollectedKeys[Math.floor(Math.random() * uncollectedKeys.length)] : keys[Math.floor(Math.random() * keys.length)];
        const cardData = ASSETS.postcards[chosenKey];

        if (!state.postcards.some(p => p.title === cardData.title)) {
          state.postcards.push(cardData);
        }
        state.coins += 50;
        saveGame();
        renderHUD();
        alert(`🌸 ${traveler.name} 散步回來了！寄回了【${cardData.title}】，並賺了 50 金幣！`);
      }, 8000);
    }

    function renderPostcardList() {
      const list = document.getElementById('postcardList');
      const empty = document.getElementById('postcardEmpty');
      const countEl = document.getElementById('postcardCount');
      list.innerHTML = '';
      countEl.textContent = state.postcards.length;

      if (state.postcards.length === 0) {
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        state.postcards.forEach(card => {
          const row = document.createElement('div');
          row.style.cssText = 'background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:10px; margin-bottom:8px; display:flex; gap:10px; align-items:center;';
          row.innerHTML = `
            <div style="width:65px; height:65px; flex-shrink:0; background:#faf4ed; border-radius:10px; display:flex; align-items:center; justify-content:center;">${card.svg}</div>
            <div style="font-size:12px; color:var(--main-text);"><b style="font-size:13px;">${card.title}</b><p style="margin-top:2px;">${card.desc}</p></div>
          `;
          list.appendChild(row);
        });
      }
    }

    // 10. 雜貨鋪與建造模式
    function openShop() {
      document.getElementById('shopCoinText').textContent = state.coins;
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';
      Object.keys(ASSETS.hats).forEach(id => {
        if (!state.inventory.includes(id)) renderShopItem(grid, ASSETS.hats[id], () => buyItem(id, 'hat', ASSETS.hats[id].cost));
      });
      Object.keys(ASSETS.furniture).forEach(id => {
        if (!state.inventory.includes(id)) renderShopItem(grid, ASSETS.furniture[id], () => buyItem(id, 'furniture', ASSETS.furniture[id].cost));
      });
      document.getElementById('shopModal').style.display = 'flex';
    }

    function renderShopItem(con, item, onBuy) {
      const card = document.createElement('div');
      card.className = 'card-item';
      card.innerHTML = `<div class="preview-box">${item.svg}</div><b>${item.name}</b><span>🪙 ${item.cost} 幣</span>`;
      const btn = document.createElement('button');
      btn.className = 'btn-action';
      btn.style.cssText = 'padding:6px; margin-top:4px;';
      btn.textContent = '購買';
      btn.onclick = onBuy;
      card.appendChild(btn);
      con.appendChild(card);
    }

    function buyItem(id, type, cost) {
      if (state.coins < cost) return alert('金幣不夠了！快去玩小遊戲吧！');
      state.coins -= cost;
      state.inventory.push(id);
      if (type === 'furniture') {
        const item = ASSETS.furniture[id];
        state.furnitureCoords[id] = { x: item.defaultX, y: window.innerHeight * item.defaultY };
        renderFurniture();
      }
      saveGame();
      renderHUD();
      alert('購買成功！');
      openShop();
    }

    function toggleBuildMode() {
      state.isBuilding = !state.isBuilding;
      document.getElementById('buildBanner').style.display = state.isBuilding ? 'block' : 'none';
      document.getElementById('buildBtnText').textContent = state.isBuilding ? '完成佈置' : '建造模式';
      world.classList.toggle('build-mode', state.isBuilding);
      renderFurniture();
      if (!state.isBuilding) saveGame();
    }

    // 11. 接瓜子 MiniGame
    function showMiniGameIntro() { document.getElementById('rulesModal').style.display = 'flex'; }
    const gameScreen = document.getElementById('minigame-screen');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let loopId, timerId, gScore = 0, gTime = 20;
    let basket = { x: 0, y: 0, w: 60, h: 50 }, drops = [];

    function reallyStartMiniGame() {
      closeModal('rulesModal');
      gameScreen.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      basket.x = canvas.width / 2 - 30;
      basket.y = canvas.height - 110;
      gScore = 0; gTime = 20; drops = [];
      document.getElementById('gameScore').textContent = gScore;
      document.getElementById('gameTimer').textContent = gTime;

      canvas.ontouchmove = (e) => { basket.x = e.touches[0].clientX - basket.w / 2; };
      canvas.onmousemove = (e) => { basket.x = e.clientX - basket.w / 2; };

      timerId = setInterval(() => {
        gTime--;
        document.getElementById('gameTimer').textContent = gTime;
        if (gTime <= 0) finishMiniGame();
      }, 1000);
      runGame();
    }

    function runGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (Math.random() < 0.08) {
        drops.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -20,
          speed: 3 + Math.random() * 3,
          isCoin: Math.random() < 0.45,
          isRock: Math.random() < 0.2
        });
      }
      ctx.fillStyle = '#e8a86b';
      ctx.beginPath();
      ctx.arc(basket.x + 30, basket.y + 25, 24, 0, Math.PI * 2);
      ctx.fill();

      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.y += d.speed;
        if (d.isRock) {
          ctx.fillStyle = '#6c757d'; ctx.beginPath(); ctx.arc(d.x, d.y, 11, 0, Math.PI * 2); ctx.fill();
        } else if (d.isCoin) {
          ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = '#5a4b3d'; ctx.beginPath(); ctx.ellipse(d.x, d.y, 6, 10, 0, 0, Math.PI * 2); ctx.fill();
        }
        if (d.y > basket.y && d.y < basket.y + basket.h && d.x > basket.x && d.x < basket.x + basket.w) {
          if (d.isRock) gScore = Math.max(0, gScore - 10);
          else if (d.isCoin) gScore += 15;
          else gScore += 5;
          document.getElementById('gameScore').textContent = gScore;
          drops.splice(i, 1);
          continue;
        }
        if (d.y > canvas.height) drops.splice(i, 1);
      }
      loopId = requestAnimationFrame(runGame);
    }

    function finishMiniGame() {
      cancelAnimationFrame(loopId);
      clearInterval(timerId);
      gameScreen.style.display = 'none';
      const earned = Math.floor(gScore / 2);
      state.coins += earned;
      saveGame();
      renderHUD();
      alert(`挑戰結束！總得分 ${gScore}，折算獲得 🪙 ${earned} 金幣！`);
    }

    function toggleDock() {
      const d = document.getElementById('mainDock');
      const b = document.getElementById('dockToggleBtn');
      if (d.classList.contains('collapsed')) { d.classList.remove('collapsed'); b.textContent = '收'; }
      else { d.classList.add('collapsed'); b.textContent = '展'; }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function renderHUD() {
      document.getElementById('valCoins').textContent = state.coins;
      document.getElementById('valHamsterCount').textContent = state.hamsters.length;
    }

    renderFurniture();
    renderHamsters();
    renderHUD();
  </script>
</body>
</html>
