<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket Pet | 寵物日常</title>
  <style>
    :root {
      --bg-sky: linear-gradient(180deg, #d8eeff 0%, #fdfbf7 70%);
      --floor: #e0d0b8;
      --floor-dark: #bba287;
      --panel-bg: rgba(255, 255, 255, 0.82);
      --text: #4a3b32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #world {
      width: 100%;
      height: 100%;
      position: relative;
      background: var(--bg-sky);
      overflow: hidden;
    }

    /* 頂部輕量狀態條 (避開瀏海區) */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .hud {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex;
      gap: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .clock-pill {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    /* 房間布景 */
    .window {
      position: absolute;
      top: 15%;
      left: 12%;
      width: 110px;
      height: 140px;
      background: rgba(255,255,255,0.45);
      border: 5px solid #fff;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      pointer-events: none;
    }
    .window div { background: rgba(255,255,255,0.2); border-radius: 4px; }
    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 38%;
      background: var(--floor);
      border-top: 6px solid var(--floor-dark);
    }
    .rug {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 90px;
      border-radius: 50px;
      background: #ebdcc9;
      border: 2px dashed #baa493;
      pointer-events: none;
    }

    /* 寵物本體與帽子層 */
    #pet-container {
      position: absolute;
      width: 80px;
      height: 80px;
      z-index: 10;
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #pet-hat {
      position: absolute;
      top: -16px;
      font-size: 26px;
      pointer-events: none;
      z-index: 12;
    }
    #pet {
      font-size: 58px;
      line-height: 1;
      pointer-events: none;
      transition: transform 0.1s;
    }
    #pet-container.held { cursor: grabbing; animation: panic 0.12s infinite alternate; }
    #pet-container.waddling #pet { animation: waddle 0.2s infinite alternate ease-in-out; }
    @keyframes waddle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes panic { from { transform: scale(1.1) rotate(-10deg); } to { transform: scale(1.1) rotate(10deg); } }

    /* 食物與粒子 */
    .spawn-food {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      z-index: 5;
      animation: dropBouncy 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes dropBouncy {
      0% { transform: translateY(-30px) scale(0.4); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .floating-pop {
      position: absolute;
      font-size: 22px;
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
    }

    /* 手機專用底部橫向微型導航列 (絕不遮擋) */
    .dock {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(15px);
      padding: 6px 12px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      display: flex;
      gap: 10px;
      z-index: 25;
      border: 1px solid rgba(255,255,255,0.6);
    }
    .dock-btn {
      background: transparent;
      border: none;
      padding: 8px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      min-width: 58px;
    }
    .dock-btn span:first-child { font-size: 20px; }
    .dock-btn:active { transform: scale(0.92); background: rgba(0,0,0,0.04); }

    /* 小遊戲與彈窗全螢幕層 */
    .overlay-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: #fdfbf7;
      padding: 24px;
      border-radius: 24px;
      width: 85%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .btn-main {
      width: 100%;
      background: #4a3b32;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: bold;
      margin-top: 14px;
      cursor: pointer;
    }

    /* 接食物小遊戲畫布層 */
    #minigame-screen {
      position: fixed;
      inset: 0;
      background: #eef7fc;
      z-index: 150;
      display: none;
    }
    #game-canvas { width: 100%; height: 100%; }
    .game-hud {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div id="world">
    <!-- 頂部資訊 -->
    <div class="top-bar">
      <div class="hud">
        <span>🍙 <b id="uiHunger">80</b>%</span>
        <span>✨ <b id="uiHappy">80</b>%</span>
        <span>💰 <b id="uiCoins">50</b></span>
      </div>
      <div class="clock-pill" id="uiClock">06:45</div>
    </div>

    <!-- 背景元素 -->
    <div class="window"><div></div><div></div><div></div><div></div></div>
    <div class="floor"></div>
    <div class="rug"></div>

    <!-- 寵物物件 -->
    <div id="pet-container">
      <div id="pet-hat"></div>
      <div id="pet">🐹</div>
    </div>

    <!-- 底部橫向微型 Dock -->
    <div class="dock">
      <button class="dock-btn" onclick="tossFoodDirect()">
        <span>🌻</span><span>餵食</span>
      </button>
      <button class="dock-btn" onclick="startMiniGame()">
        <span>🎮</span><span>接瓜子</span>
      </button>
      <button class="dock-btn" onclick="startTravel()">
        <span>🎒</span><span>散步</span>
      </button>
      <button class="dock-btn" onclick="openShop()">
        <span>🛒</span><span>商店</span>
      </button>
    </div>
  </div>

  <!-- 接瓜子小遊戲全螢幕 -->
  <div id="minigame-screen">
    <div class="game-hud">
      <div>分數: <span id="gameScore">0</span></div>
      <div>倒數: <span id="gameTimer">20</span>s</div>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <!-- 彈窗 (通用) -->
  <div class="overlay-modal" id="genericModal">
    <div class="modal-box">
      <h3 id="modalTitle" style="color: #4a3b32; margin-bottom: 12px;"></h3>
      <div id="modalContent" style="font-size: 14px; color: #6e503e; line-height: 1.6;"></div>
      <button class="btn-main" onclick="closeModal()">好的！</button>
    </div>
  </div>

  <!-- 商店彈窗 -->
  <div class="overlay-modal" id="shopModal">
    <div class="modal-box">
      <h3 style="color:#4a3b32; margin-bottom: 8px;">寵物精品店 🛍️</h3>
      <p style="font-size: 13px; color:#888; margin-bottom: 16px;">目前金幣: <b id="shopCoinVal">0</b></p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn-main" style="background:#fff; color:#4a3b32; border:1px solid #ddd; margin:0;" onclick="buyItem('hat_leaf', 30)">
          🌱 幸運草頭飾 (30 幣)
        </button>
        <button class="btn-main" style="background:#fff; color:#4a3b32; border:1px solid #ddd; margin:0;" onclick="buyItem('hat_crown', 80)">
          👑 小皇冠 (80 幣)
        </button>
        <button class="btn-main" style="background:#fff; color:#4a3b32; border:1px solid #ddd; margin:0;" onclick="switchPetType()">
          🔄 切換外型 (倉鼠 / 柴犬)
        </button>
      </div>
      <button class="btn-main" onclick="closeShop()">關閉</button>
    </div>
  </div>

  <script>
    const state = {
      hunger: 80,
      happy: 80,
      coins: 50,
      petType: 'hamster',
      hat: '',
      x: window.innerWidth / 2 - 40,
      y: window.innerHeight * 0.65,
      isHeld: false,
      isTraveling: false
    };

    const petBox = document.getElementById('pet-container');
    const petChar = document.getElementById('pet');
    const petHat = document.getElementById('pet-hat');
    const world = document.getElementById('world');

    // 限制在安全活動範圍內 (地板區，避開頂部與底部 Dock)
    function setPosition(x, y) {
      const minX = 20;
      const maxX = window.innerWidth - 100;
      const minY = window.innerHeight * 0.55;
      const maxY = window.innerHeight * 0.76;

      state.x = Math.max(minX, Math.min(maxX, x));
      state.y = Math.max(minY, Math.min(maxY, y));
      petBox.style.left = `${state.x}px`;
      petBox.style.top = `${state.y}px`;
    }
    setPosition(state.x, state.y);

    // 1. 拖曳與搔癢邏輯
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let tickleCount = 0;

    petBox.addEventListener('pointerdown', (e) => {
      if (state.isTraveling) return;
      isDragging = true;
      petBox.classList.add('held');
      dragStart.x = e.clientX - state.x;
      dragStart.y = e.clientY - state.y;
      petBox.setPointerCapture(e.pointerId);
    });

    petBox.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      // 判斷是否為搔癢小滑動
      tickleCount++;
      if (tickleCount % 12 === 0) {
        spawnPop('❤️', state.x + 30, state.y - 10);
        state.happy = Math.min(100, state.happy + 2);
        updateHUD();
      }
      setPosition(e.clientX - dragStart.x, e.clientY - dragStart.y);
    });

    petBox.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;
      petBox.classList.remove('held');
      setPosition(state.x, window.innerHeight * 0.68);
    });

    // 2. 點擊地板投擲食物 (點哪丟哪)
    world.addEventListener('pointerdown', (e) => {
      // 點在頂部或底部 dock 不觸發
      if (e.clientY < 80 || e.clientY > window.innerHeight - 100 || isDragging) return;
      dropFoodAt(e.clientX - 15, e.clientY - 15);
    });

    function tossFoodDirect() {
      dropFoodAt(Math.random() * (window.innerWidth - 80) + 40, window.innerHeight * 0.68);
    }

    function dropFoodAt(x, y) {
      const food = document.createElement('div');
      food.className = 'spawn-food';
      food.textContent = '🌻';
      food.style.left = `${x}px`;
      food.style.top = `${y}px`;
      world.appendChild(food);

      // 寵物小跑步跑過去吃
      petBox.classList.add('waddling');
      const startX = state.x;
      const targetX = x - 25;
      let progress = 0;

      const runInterval = setInterval(() => {
        progress += 0.08;
        setPosition(startX + (targetX - startX) * progress, state.y);
        if (progress >= 1) {
          clearInterval(runInterval);
          petBox.classList.remove('waddling');
          food.remove();
          spawnPop('😋', state.x + 25, state.y - 10);
          state.hunger = Math.min(100, state.hunger + 15);
          updateHUD();
        }
      }, 20);
    }

    // 3. 飄浮表情氣泡
    function spawnPop(text, x, y) {
      const p = document.createElement('div');
      p.className = 'floating-pop';
      p.textContent = text;
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      world.appendChild(p);
      setTimeout(() => p.remove(), 700);
    }

    // 4. 接瓜子小遊戲 (實時操控玩法)
    const minigameScreen = document.getElementById('minigame-screen');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let gameLoopId, gameIntervalId;
    let score = 0, timeLeft = 20;
    let basket = { x: 0, y: 0, w: 70, h: 50 };
    let items = [];

    function startMiniGame() {
      minigameScreen.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      basket.y = canvas.height - 110;
      basket.x = canvas.width / 2 - 35;
      score = 0;
      timeLeft = 20;
      items = [];
      document.getElementById('gameScore').textContent = score;
      document.getElementById('gameTimer').textContent = timeLeft;

      // 監聽觸控滑動
      canvas.ontouchmove = (e) => {
        basket.x = e.touches[0].clientX - basket.w / 2;
      };
      canvas.onmousemove = (e) => {
        basket.x = e.clientX - basket.w / 2;
      };

      gameIntervalId = setInterval(() => {
        timeLeft--;
        document.getElementById('gameTimer').textContent = timeLeft;
        if (timeLeft <= 0) stopMiniGame();
      }, 1000);

      runMiniGameLoop();
    }

    function runMiniGameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 生成掉落物
      if (Math.random() < 0.06) {
        items.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -20,
          speed: 3 + Math.random() * 3,
          isBomb: Math.random() < 0.2
        });
      }

      // 畫主角
      ctx.font = '50px sans-serif';
      ctx.fillText(state.petType === 'hamster' ? '🐹' : '🐕', basket.x, basket.y + 40);

      // 更新掉落物
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.speed;
        ctx.font = '30px sans-serif';
        ctx.fillText(it.isBomb ? '💩' : '🌻', it.x, it.y);

        // 碰撞檢測
        if (it.y > basket.y && it.y < basket.y + basket.h && it.x > basket.x - 20 && it.x < basket.x + basket.w) {
          if (it.isBomb) {
            score = Math.max(0, score - 5);
          } else {
            score += 10;
          }
          document.getElementById('gameScore').textContent = score;
          items.splice(i, 1);
          continue;
        }

        if (it.y > canvas.height) items.splice(i, 1);
      }

      gameLoopId = requestAnimationFrame(runMiniGameLoop);
    }

    function stopMiniGame() {
      cancelAnimationFrame(gameLoopId);
      clearInterval(gameIntervalId);
      minigameScreen.style.display = 'none';

      const earnedCoins = Math.floor(score / 2);
      state.coins += earnedCoins;
      state.happy = Math.min(100, state.happy + 25);
      state.hunger = Math.max(10, state.hunger - 15);
      updateHUD();

      showModal('遊戲結束 🎉', `你接到了超多葵花子！<br>獲得金幣獎勵：<b>+${earnedCoins}</b> 💰`);
    }

    // 5. 散步與商店邏輯
    function startTravel() {
      if (state.isTraveling) return;
      state.isTraveling = true;
      petBox.style.display = 'none';
      showModal('出門冒險 🎒', '小傢伙背上小書包出門散步了，預計 10 秒後帶禮物回來！');

      setTimeout(() => {
        state.isTraveling = false;
        petBox.style.display = 'flex';
        const gain = Math.floor(Math.random() * 25) + 15;
        state.coins += gain;
        updateHUD();
        showModal('散步回來啦 🌸', `小傢伙在路上遇到小黑貓一起玩耍，帶回了 <b>${gain}</b> 枚金幣！`);
      }, 10000);
    }

    function openShop() {
      document.getElementById('shopCoinVal').textContent = state.coins;
      document.getElementById('shopModal').style.display = 'flex';
    }
    function closeShop() { document.getElementById('shopModal').style.display = 'none'; }

    function buyItem(type, cost) {
      if (state.coins < cost) {
        alert('金幣不夠了！快去玩「接瓜子」賺錢吧！');
        return;
      }
      state.coins -= cost;
      if (type === 'hat_leaf') { state.hat = '🌱'; petHat.textContent = '🌱'; }
      if (type === 'hat_crown') { state.hat = '👑'; petHat.textContent = '👑'; }
      updateHUD();
      closeShop();
    }

    function switchPetType() {
      state.petType = state.petType === 'hamster' ? 'dog' : 'hamster';
      petChar.textContent = state.petType === 'hamster' ? '🐹' : '🐕';
      closeShop();
    }

    function showModal(title, content) {
      document.getElementById('modalTitle').innerHTML = title;
      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('genericModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('genericModal').style.display = 'none'; }

    // 6. 狀態與時鐘
    function updateHUD() {
      document.getElementById('uiHunger').textContent = Math.round(state.hunger);
      document.getElementById('uiHappy').textContent = Math.round(state.happy);
      document.getElementById('uiCoins').textContent = state.coins;
    }

    setInterval(() => {
      const d = new Date();
      document.getElementById('uiClock').textContent = 
        `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      
      // 自然消耗
      if (!state.isTraveling) {
        state.hunger = Math.max(0, state.hunger - 1);
        state.happy = Math.max(0, state.happy - 1);
        updateHUD();
      }
    }, 4000);

    updateHUD();
  </script>
</body>
</html>
