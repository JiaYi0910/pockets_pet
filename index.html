<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket Hamsters | 倉鼠大家庭</title>
  <style>
    :root {
      --bg-wall: #fbf8f3;
      --floor-base: #dfceb7;
      --floor-line: #cfbb9f;
      --card-bg: rgba(255, 255, 255, 0.94);
      --main-text: #4a3b32;
      --accent: #d97736;
      --border-color: #ebdccb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      background: var(--bg-wall);
    }

    #world {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 頂部 HUD */
    .top-bar {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .hud-pill {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.08);
      display: flex;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--main-text);
      border: 1px solid var(--border-color);
    }
    .btn-pill {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--main-text);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.08);
    }

    /* 房間結構 */
    .wall-window {
      position: absolute;
      top: 14%;
      left: 8%;
      width: 110px;
      height: 140px;
      background: #eef7fc;
      border: 5px solid #fff;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      pointer-events: none;
    }
    .wall-window div { background: rgba(255,255,255,0.45); border-radius: 3px; }
    .floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 42%;
      background: repeating-linear-gradient(90deg, var(--floor-base) 0px, var(--floor-base) 90px, var(--floor-line) 90px, var(--floor-line) 92px);
      border-top: 6px solid #b8a082;
    }

    .build-banner {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(217, 119, 54, 0.9);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      z-index: 50;
      display: none;
    }
    #world.build-mode .floor {
      background-image: linear-gradient(rgba(217, 119, 54, 0.15) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(217, 119, 54, 0.15) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    /* 家具層 */
    #furniture-layer {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
    }
    .placed-furniture {
      position: absolute;
      touch-action: none;
      cursor: pointer;
      pointer-events: auto;
    }
    .placed-furniture.building {
      outline: 2px dashed var(--accent);
      border-radius: 8px;
    }

    /* 多隻倉鼠通用實體容器 */
    .hamster-entity {
      position: absolute;
      width: 80px;
      height: 80px;
      z-index: 10;
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
    }
    .hamster-entity.held { cursor: grabbing; animation: panicShake 0.12s infinite alternate; }
    .hamster-entity.walking svg.hamster-svg { animation: walkWaddle 0.2s infinite alternate ease-in-out; }
    @keyframes walkWaddle { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
    @keyframes panicShake { from { transform: scale(1.08) rotate(-8deg); } to { transform: scale(1.08) rotate(8deg); } }

    .hamster-hat-slot {
      position: absolute;
      top: -12px;
      width: 48px;
      height: 32px;
      z-index: 12;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 食物與愛心 */
    .sunflower-seed {
      position: absolute;
      width: 16px;
      height: 24px;
      background: #3e3228;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      border: 2px solid #5a4b3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      pointer-events: none;
      z-index: 5;
      animation: seedDrop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .sunflower-seed::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 3px;
      width: 3px;
      height: 14px;
      background: #fdfbf7;
      border-radius: 3px;
      opacity: 0.8;
    }
    @keyframes seedDrop {
      0% { transform: translateY(-30px) scale(0.4); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .heart-pop {
      position: absolute;
      font-size: 20px;
      color: #e76f51;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 30;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
    }

    /* 寬版可收合底部 Dock */
    .dock-wrapper {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 14px) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dock {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      padding: 8px 14px;
      border-radius: 26px;
      box-shadow: 0 8px 24px rgba(74, 59, 50, 0.12);
      display: flex;
      gap: 10px;
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dock.collapsed {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8) translateY(20px);
      position: absolute;
    }
    .dock-btn {
      background: transparent;
      border: none;
      padding: 6px 10px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--main-text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    .dock-btn svg { width: 22px; height: 22px; stroke: var(--main-text); stroke-width: 2; fill: none; }
    .dock-btn:active { transform: scale(0.92); }

    .toggle-dock-btn {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--main-text);
      font-size: 13px;
      font-weight: bold;
    }

    /* 通用彈窗 Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 35, 30, 0.5);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-card {
      background: #fdfaf6;
      padding: 22px;
      border-radius: 24px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-height: 84vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 17px; color: var(--main-text); margin-bottom: 14px; text-align: center; }
    .btn-action {
      background: var(--main-text);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .card-item {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--main-text);
    }
    .preview-box {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 遊戲全螢幕與規則彈窗 */
    #minigame-screen {
      position: fixed;
      inset: 0;
      background: #fbf6ee;
      z-index: 150;
      display: none;
    }
    #game-canvas { width: 100%; height: 100%; }
    .game-hud {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: bold;
      color: var(--main-text);
    }
  </style>
</head>
<body>

  <div id="world">
    <!-- 頂部 HUD -->
    <div class="top-bar">
      <div class="hud-pill">
        <span>金幣 🪙 <b id="valCoins">150</b></span>
        <span>成員 🐹 <b id="valHamsterCount">1</b>隻</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-pill" onclick="openAdoptCenter()">領養中心 🏡</button>
        <button class="btn-pill" onclick="openProfile()">鼠鼠手帳 📋</button>
      </div>
    </div>

    <div class="build-banner" id="buildBanner">建造模式中：點擊並拖曳家具移動位置</div>

    <!-- 房間與家具 -->
    <div class="wall-window"><div></div><div></div><div></div><div></div></div>
    <div class="floor"></div>
    <div id="furniture-layer"></div>

    <!-- 倉鼠活動層 (支援多隻倉鼠) -->
    <div id="hamster-layer"></div>

    <!-- 底部 Dock -->
    <div class="dock-wrapper">
      <div class="dock" id="mainDock">
        <button class="dock-btn" onclick="openShop()">
          <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          雜貨鋪
        </button>
        <button class="dock-btn" onclick="openWardrobe()">
          <svg viewBox="0 0 24 24"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
          換衣服
        </button>
        <button class="dock-btn" onclick="toggleBuildMode()">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span id="buildBtnText">建造模式</span>
        </button>
        <button class="dock-btn" onclick="showMiniGameIntro()">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="8" cy="12" r="1.5"/><circle cx="16" cy="10" r="1"/><circle cx="18" cy="13" r="1"/></svg>
          賺金幣
        </button>
        <button class="dock-btn" onclick="openPostcardBook()">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          紀念冊
        </button>
      </div>
      <button class="toggle-dock-btn" id="dockToggleBtn" onclick="toggleDock()">收</button>
    </div>
  </div>

  <!-- 領養中心彈窗 -->
  <div class="modal-overlay" id="adoptModal">
    <div class="modal-card">
      <h3 class="modal-title">倉鼠領養中心 🏡</h3>
      <p style="font-size:12px; text-align:center; color:#888;">金幣餘額：<b id="adoptCoinVal">0</b></p>
      <div class="grid-container" id="adoptGrid"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('adoptModal')">下次再來</button>
    </div>
  </div>

  <!-- 個人資料手帳 -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-card">
      <h3 class="modal-title">倉鼠家族手帳 📋</h3>
      <div id="hamsterCardList"></div>
      <button class="btn-action" onclick="closeModal('profileModal')">關閉</button>
    </div>
  </div>

  <!-- 換衣服 衣櫥 -->
  <div class="modal-overlay" id="wardrobeModal">
    <div class="modal-card">
      <h3 class="modal-title">換裝衣櫥 🧣</h3>
      <p style="font-size:12px; text-align:center; color:#888;">為當前焦點鼠鼠換上飾品</p>
      <div class="grid-container" id="wardrobeGrid"></div>
      <button class="btn-action" onclick="closeModal('wardrobeModal')">打扮完成</button>
    </div>
  </div>

  <!-- 商店彈窗 (大幅擴充物品) -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-card">
      <h3 class="modal-title">雜貨小鋪 🛒</h3>
      <p style="font-size:12px; text-align:center; color:#888;">金幣餘額：<b id="shopCoinText">0</b></p>
      <div class="grid-container" id="shopGrid"></div>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('shopModal')">離開</button>
    </div>
  </div>

  <!-- 明信片紀念手帳 -->
  <div class="modal-overlay" id="postcardModal">
    <div class="modal-card">
      <h3 class="modal-title">旅行紀念手帳 📖</h3>
      <div id="postcardEmpty" style="font-size:13px; text-align:center; color:#888; padding:20px 0;">還沒有明信片，放小傢伙去散步吧！</div>
      <div id="postcardList"></div>
      <button class="btn-action" style="margin-bottom:8px;" onclick="sendPetToTravel()">讓鼠鼠出門散步 🎒</button>
      <button class="btn-action" style="background:#8b786d;" onclick="closeModal('postcardModal')">合上手帳</button>
    </div>
  </div>

  <!-- 小遊戲規則說明彈窗 -->
  <div class="modal-overlay" id="rulesModal">
    <div class="modal-card">
      <h3 class="modal-title">接瓜子大作戰 🎮</h3>
      <div style="background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:14px; font-size:13px; line-height:1.8; color:var(--main-text);">
        <p><b>遊戲玩法：</b>用手指左右滑動接住落下的寶物，限時 20 秒！</p>
        <p style="margin-top:6px;">🪙 <b>金色金幣</b>：+15 分（直接折合金幣）</p>
        <p>🌻 <b>向日葵瓜子</b>：+5 分</p>
        <p>🪨 <b>落石</b>：扣 10 分（一定要閃避！）</p>
      </div>
      <button class="btn-action" style="background:var(--accent);" onclick="reallyStartMiniGame()">開始挑戰！</button>
      <button class="btn-action" style="background:#8b786d; margin-top:6px;" onclick="closeModal('rulesModal')">取消</button>
    </div>
  </div>

  <!-- 小遊戲全螢幕 -->
  <div id="minigame-screen">
    <div class="game-hud">
      <div>金幣得分: <span id="gameScore">0</span></div>
      <div>倒數: <span id="gameTimer">20</span>s</div>
    </div>
    <canvas id="game-canvas"></canvas>
  </div>

  <script>
    // 倉鼠外觀生成器 (支援多品種毛色)
    const SPECIES = {
      golden: { name: '金絲熊', cost: 0, body: '#e8a86b', belly: '#fffdfa', ear: '#f4b7a1' },
      silver: { name: '銀狐鼠', cost: 100, body: '#e9ecef', belly: '#ffffff', ear: '#adb5bd' },
      bear: { name: '黑熊鼠', cost: 150, body: '#495057', belly: '#ced4da', ear: '#343a40' },
      pudding: { name: '布丁鼠', cost: 180, body: '#ffd166', belly: '#fff3b0', ear: '#f4a261' }
    };

    function generateHamsterSVG(speciesKey) {
      const s = SPECIES[speciesKey] || SPECIES.golden;
      return `<svg class="hamster-svg" viewBox="0 0 100 100" width="80" height="80">
        <circle cx="15" cy="65" r="7" fill="${s.ear}" />
        <ellipse cx="50" cy="60" rx="36" ry="32" fill="${s.body}" />
        <ellipse cx="52" cy="68" rx="24" ry="20" fill="${s.belly}" />
        <circle cx="30" cy="28" r="10" fill="${s.body}" />
        <circle cx="30" cy="28" r="6" fill="${s.ear}" />
        <circle cx="70" cy="28" r="10" fill="${s.body}" />
        <circle cx="70" cy="28" r="6" fill="${s.ear}" />
        <circle cx="40" cy="46" r="4.5" fill="#2d2013" />
        <circle cx="38.5" cy="44.5" r="1.5" fill="#fff" />
        <circle cx="62" cy="46" r="4.5" fill="#2d2013" />
        <circle cx="60.5" cy="44.5" r="1.5" fill="#fff" />
        <circle cx="32" cy="54" r="5" fill="#f79d84" opacity="0.6" />
        <circle cx="70" cy="54" r="5" fill="#f79d84" opacity="0.6" />
        <polygon points="51,52 48,49 54,49" fill="#df7a6b" />
        <path d="M47 55 Q51 58 55 55" stroke="#4a3b32" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <ellipse cx="40" cy="64" rx="4.5" ry="6" fill="${s.belly}" />
        <ellipse cx="62" cy="64" rx="4.5" ry="6" fill="${s.belly}" />
      </svg>`;
    }

    // 向量素材庫 (大量擴充裝飾與家具)
    const ASSETS = {
      hats: {
        straw_hat: { name: '夏日草帽', cost: 30, svg: `<svg viewBox="0 0 60 40" width="46" height="30"><path d="M5 28 Q30 22 55 28 Q30 34 5 28" fill="#e9c46a" stroke="#d4a373" stroke-width="2"/><ellipse cx="30" cy="20" rx="16" ry="12" fill="#f4a261"/><rect x="14" y="20" width="32" height="4" fill="#e76f51"/></svg>` },
        pink_bow: { name: '粉櫻蝴蝶結', cost: 45, svg: `<svg viewBox="0 0 50 35" width="40" height="28"><polygon points="25,18 10,8 10,28" fill="#f4a5ae"/><polygon points="25,18 40,8 40,28" fill="#f4a5ae"/><ellipse cx="25" cy="18" rx="5" ry="5" fill="#e56b81"/></svg>` },
        grad_cap: { name: '學士帽', cost: 70, svg: `<svg viewBox="0 0 60 40" width="46" height="30"><polygon points="30,8 54,18 30,28 6,18" fill="#2b2d42"/><rect x="22" y="24" width="16" height="8" fill="#1d1e2c"/><path d="M48 20 L48 30" stroke="#f4a261" stroke-width="2"/><circle cx="48" cy="31" r="2" fill="#f4a261"/></svg>` },
        detective_hat: { name: '福爾摩斯帽', cost: 90, svg: `<svg viewBox="0 0 60 40" width="46" height="30"><path d="M10 26 Q30 8 50 26 Z" fill="#7f5539"/><ellipse cx="30" cy="26" rx="26" ry="6" fill="#9c6644"/><rect x="26" y="10" width="8" height="4" fill="#582f0e"/></svg>` },
        red_hood: { name: '小紅帽圍巾', cost: 55, svg: `<svg viewBox="0 0 50 35" width="40" height="28"><path d="M12 28 Q25 10 38 28 Z" fill="#d90429"/><circle cx="25" cy="10" r="3" fill="#ef233c"/></svg>` }
      },
      furniture: {
        wheel: { name: '靜音木跑輪', cost: 60, defaultX: 30, defaultY: 0.65, svg: `<svg viewBox="0 0 100 100" width="80" height="80"><circle cx="50" cy="50" r="42" fill="none" stroke="#d4a373" stroke-width="6"/><circle cx="50" cy="50" r="8" fill="#8c6239"/><line x1="50" y1="8" x2="50" y2="92" stroke="#d4a373" stroke-width="3"/><line x1="8" y1="50" x2="92" y2="50" stroke="#d4a373" stroke-width="3"/><path d="M30 92 L50 50 L70 92" stroke="#8c6239" stroke-width="6" fill="none"/></svg>` },
        mushroom_house: { name: '原木蘑菇窩', cost: 80, defaultX: 230, defaultY: 0.65, svg: `<svg viewBox="0 0 100 100" width="85" height="85"><rect x="30" y="50" width="40" height="40" rx="8" fill="#f5ebe0"/><path d="M15 52 Q50 10 85 52 Z" fill="#e76f51"/><circle cx="36" cy="34" r="5" fill="#fff"/><circle cx="62" cy="30" r="6" fill="#fff"/><circle cx="50" cy="44" r="4" fill="#fff"/><path d="M40 90 A10 10 0 0 1 60 90 Z" fill="#7f5539"/></svg>` },

        sunflower_pot: { name: '向日葵小盆栽', cost: 50, defaultX: 180, defaultY: 0.60, svg: `<svg viewBox="0 0 60 80" width="50" height="65"><polygon points="18,50 42,50 38,75 22,75" fill="#b08968"/><circle cx="30" cy="30" r="10" fill="#603808"/><circle cx="30" cy="18" r="5" fill="#ffb703"/><circle cx="42" cy="25" r="5" fill="#ffb703"/><circle cx="42" cy="35" r="5" fill="#ffb703"/><circle cx="30" cy="42" r="5" fill="#ffb703"/><circle cx="18" cy="35" r="5" fill="#ffb703"/><circle cx="18" cy="25" r="5" fill="#ffb703"/><line x1="30" y1="42" x2="30" y2="52" stroke="#588157" stroke-width="3"/></svg>` }
      },
      postcards: {
        shrine: { title: '京都神社之櫻', desc: '在千本鳥居旁散步，偶遇了微風吹落的春櫻花瓣。', svg: `<svg viewBox="0 0 80 80" width="70" height="70"><rect width="80" height="80" rx="10" fill="#fceade"/><polygon points="20,70 20,35 60,35 60,70" fill="none" stroke="#d90429" stroke-width="6"/><line x1="12" y1="35" x2="68" y2="35" stroke="#d90429" stroke-width="8"/><circle cx="60" cy="20" r="4" fill="#ffb4a2"/><circle cx="45" cy="15" r="3" fill="#ffb4a2"/></svg>` },
        field: { title: '陽光向日葵田', desc: '置身在向日葵海裡，摘了幾顆新鮮飽滿的葵花子！', svg: `<svg viewBox="0 0 80 80" width="70" height="70"><rect width="80" height="80" rx="10" fill="#e9f5db"/><circle cx="40" cy="38" r="16" fill="#603808"/><circle cx="40" cy="20" r="6" fill="#ffb703"/><circle cx="56" cy="30" r="6" fill="#ffb703"/><circle cx="56" cy="46" r="6" fill="#ffb703"/><circle cx="40" cy="56" r="6" fill="#ffb703"/><circle cx="24" cy="46" r="6" fill="#ffb703"/><circle cx="24" cy="30" r="6" fill="#ffb703"/></svg>` },
        beach: { title: '黃金海岸浪花', desc: '在細緻的金黃沙灘邊追浪，拾獲了五彩繽紛的貝殼。', svg: `<svg viewBox="0 0 80 80" width="70" height="70"><rect width="80" height="80" rx="10" fill="#caf0f8"/><ellipse cx="40" cy="65" rx="35" ry="12" fill="#ffd166"/><circle cx="65" cy="22" r="8" fill="#f77f00"/></svg>` }
      }
    };

    // 遊戲存檔與狀態管理
    const STORAGE_KEY = 'pocket_hamster_save_v4';
    let saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch(e) { saved = {}; }

    const state = {
      coins: saved.coins ?? 150,
      hamsters: saved.hamsters || [
        { id: 'h_1', name: '泡泡', species: 'golden', feedCount: 0, equippedHat: 'straw_hat', x: window.innerWidth / 2 - 40, y: window.innerHeight * 0.68 }
      ],
      currentFocusId: saved.currentFocusId || 'h_1',
      inventory: saved.inventory || ['straw_hat', 'rug'],
      furnitureCoords: saved.furnitureCoords || {
        rug: { x: window.innerWidth / 2 - 65, y: window.innerHeight * 0.72 }
      },
      postcards: saved.postcards || [],
      isBuilding: false,
      isTraveling: false
    };

    function saveGame() {
      const dataToSave = {
        coins: state.coins,
        hamsters: state.hamsters,
        currentFocusId: state.currentFocusId,
        inventory: state.inventory,
        furnitureCoords: state.furnitureCoords,
        postcards: state.postcards
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
    }

    const world = document.getElementById('world');
    const furnitureLayer = document.getElementById('furniture-layer');
    const hamsterLayer = document.getElementById('hamster-layer');

    // 1. 多倉鼠實體渲染與自律閒晃
    function renderHamsters() {
      hamsterLayer.innerHTML = '';
      state.hamsters.forEach(h => {
        const wrap = document.createElement('div');
        wrap.className = 'hamster-entity';
        wrap.id = `entity-${h.id}`;
        wrap.style.left = `${h.x}px`;
        wrap.style.top = `${h.y}px`;

        // 成長體型變化
        const scale = h.feedCount < 10 ? 0.8 : (h.feedCount < 25 ? 1.0 : 1.25);
        wrap.style.transform = `scale(${scale})`;

        // 飾品插槽
        const hatSlot = document.createElement('div');
        hatSlot.className = 'hamster-hat-slot';
        if (h.equippedHat && ASSETS.hats[h.equippedHat]) {
          hatSlot.innerHTML = ASSETS.hats[h.equippedHat].svg;
        }
        wrap.appendChild(hatSlot);

        // SVG 本體
        wrap.insertAdjacentHTML('beforeend', generateHamsterSVG(h.species));

        // 拖曳互動
        let isHeld = false, dOffset = { x: 0, y: 0 };
        wrap.addEventListener('pointerdown', (e) => {
          if (state.isBuilding || state.isTraveling) return;
          isHeld = true;
          state.currentFocusId = h.id;
          wrap.classList.add('held');
          dOffset.x = e.clientX - h.x;
          dOffset.y = e.clientY - h.y;
          wrap.setPointerCapture(e.pointerId);
        });
        wrap.addEventListener('pointermove', (e) => {
          if (!isHeld) return;
          h.x = Math.max(15, Math.min(window.innerWidth - 95, e.clientX - dOffset.x));
          h.y = Math.max(window.innerHeight * 0.56, Math.min(window.innerHeight * 0.78, e.clientY - dOffset.y));
          wrap.style.left = `${h.x}px`;
          wrap.style.top = `${h.y}px`;
        });
        wrap.addEventListener('pointerup', () => {
          if (!isHeld) return;
          isHeld = false;
          wrap.classList.remove('held');
          h.y = window.innerHeight * 0.70;
          wrap.style.top = `${h.y}px`;
          saveGame();
        });

        hamsterLayer.appendChild(wrap);
      });
    }

    // 倉鼠自律走動
    setInterval(() => {
      if (state.isBuilding || state.isTraveling) return;
      state.hamsters.forEach(h => {
        if (Math.random() < 0.4) {
          const destX = Math.random() * (window.innerWidth - 120) + 40;
          const wrap = document.getElementById(`entity-${h.id}`);
          if (!wrap || wrap.classList.contains('held')) return;

          wrap.classList.add('walking');
          const startX = h.x;
          let p = 0;
          const step = () => {
            if (wrap.classList.contains('held') || state.isBuilding) {
              wrap.classList.remove('walking');
              return;
            }
            p += 0.03;
            h.x = startX + (destX - startX) * p;
            wrap.style.left = `${h.x}px`;
            if (p < 1) requestAnimationFrame(step);
            else wrap.classList.remove('walking');
          };
          requestAnimationFrame(step);
        }
      });
    }, 4500);

    // 2. 點擊地板丟瓜子 (最靠近的倉鼠衝過去搶食)
    world.addEventListener('pointerdown', (e) => {
      if (state.isBuilding || state.isTraveling) return;
      if (e.clientY < 90 || e.clientY > window.innerHeight - 80) return;
      dropSeed(e.clientX - 8, e.clientY - 12);
    });

    function dropSeed(x, y) {
      const seed = document.createElement('div');
      seed.className = 'sunflower-seed';
      seed.style.left = `${x}px`;
      seed.style.top = `${y}px`;
      world.appendChild(seed);

      // 尋找最近的鼠鼠
      let closestHamster = state.hamsters[0];
      let minDist = Infinity;
      state.hamsters.forEach(h => {
        const d = Math.hypot(h.x - x, h.y - y);
        if (d < minDist) { minDist = d; closestHamster = h; }
      });

      const wrap = document.getElementById(`entity-${closestHamster.id}`);
      if (!wrap) return;
      wrap.classList.add('walking');
      const startX = closestHamster.x;
      const targetX = x - 35;
      let p = 0;

      const runInterval = setInterval(() => {
        p += 0.08;
        closestHamster.x = startX + (targetX - startX) * p;
        wrap.style.left = `${closestHamster.x}px`;
        if (p >= 1) {
          clearInterval(runInterval);
          wrap.classList.remove('walking');
          seed.remove();

          closestHamster.feedCount++;
          saveGame();
          renderHamsters();

          const pop = document.createElement('div');
          pop.className = 'heart-pop';
          pop.textContent = '❤️';
          pop.style.left = `${closestHamster.x + 35}px`;
          pop.style.top = `${closestHamster.y}px`;
          world.appendChild(pop);
          setTimeout(() => pop.remove(), 800);
        }
      }, 20);
    }

    // 3. 領養中心 (花金幣領養不同品種)
    function openAdoptCenter() {
      document.getElementById('adoptCoinVal').textContent = state.coins;
      const grid = document.getElementById('adoptGrid');
      grid.innerHTML = '';

      Object.keys(SPECIES).forEach(key => {
        const sp = SPECIES[key];
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="preview-box">${generateHamsterSVG(key)}</div>
          <b>${sp.name}</b>
          <span>🪙 ${sp.cost === 0 ? '免費' : sp.cost + ' 幣'}</span>
        `;
        const btn = document.createElement('button');
        btn.className = 'btn-action';
        btn.style.cssText = 'padding:6px; margin-top:4px;';
        btn.textContent = '領養';
        btn.onclick = () => adoptHamster(key, sp);
        card.appendChild(btn);
        grid.appendChild(card);
      });
      document.getElementById('adoptModal').style.display = 'flex';
    }

    function adoptHamster(key, sp) {
      if (state.coins < sp.cost) {
        alert('金幣不夠了！快去玩小遊戲接金幣吧！');
        return;
      }
      const newName = prompt(`為這隻可愛的【${sp.name}】取個名字吧：`, sp.name);
      if (!newName || !newName.trim()) return;

      state.coins -= sp.cost;
      const newId = `h_${Date.now()}`;
      state.hamsters.push({
        id: newId,
        name: newName.trim(),
        species: key,
        feedCount: 0,
        equippedHat: null,
        x: window.innerWidth / 2 - 40 + (Math.random() * 60 - 30),
        y: window.innerHeight * 0.70
      });
      state.currentFocusId = newId;
      saveGame();
      renderHUD();
      renderHamsters();
      closeModal('adoptModal');
      alert(`🎉 恭喜你成功領養了 ${newName.trim()}！快去房間看看牠吧！`);
    }

    // 4. 倉鼠家族手帳 (查看全部成員與改名)
    function openProfile() {
      const list = document.getElementById('hamsterCardList');
      list.innerHTML = '';
      state.hamsters.forEach(h => {
        const sp = SPECIES[h.species] || SPECIES.golden;
        const stage = h.feedCount < 10 ? '幼鼠期 🌱' : (h.feedCount < 25 ? '亞成體 🌾' : '豐滿成年鼠 🌻');
        const box = document.createElement('div');
        box.style.cssText = 'background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:12px; margin-bottom:10px; font-size:13px; line-height:1.6; display:flex; align-items:center; gap:12px;';
        box.innerHTML = `
          <div style="flex-shrink:0;">${generateHamsterSVG(h.species)}</div>
          <div style="flex-grow:1;">
            <div><b>名字：</b>${h.name} <button onclick="renameSpecific('${h.id}')" style="border:none; background:none; color:var(--accent); font-weight:bold; cursor:pointer;">[改名]</button></div>
            <div><b>品種：</b>${sp.name}</div>
            <div><b>階段：</b>${stage} (嗑瓜子 ${h.feedCount} 顆)</div>
          </div>
        `;
        list.appendChild(box);
      });
      document.getElementById('profileModal').style.display = 'flex';
    }

    function renameSpecific(id) {
      const h = state.hamsters.find(item => item.id === id);
      if (!h) return;
      const n = prompt('為牠換個新名字：', h.name);
      if (n && n.trim()) {
        h.name = n.trim();
        saveGame();
        openProfile();
      }
    }

    // 5. 建造模式 (自由拖曳家具並持久化儲存)
    function toggleBuildMode() {
      state.isBuilding = !state.isBuilding;
      document.getElementById('buildBanner').style.display = state.isBuilding ? 'block' : 'none';
      document.getElementById('buildBtnText').textContent = state.isBuilding ? '完成佈置' : '建造模式';
      world.classList.toggle('build-mode', state.isBuilding);
      renderFurniture();
      if (!state.isBuilding) saveGame();
    }

    function renderFurniture() {
      furnitureLayer.innerHTML = '';
      Object.keys(state.furnitureCoords).forEach(id => {
        const item = ASSETS.furniture[id];
        if (!item) return;

        const coords = state.furnitureCoords[id];
        const el = document.createElement('div');
        el.className = `placed-furniture ${state.isBuilding ? 'building' : ''}`;
        el.innerHTML = item.svg;
        el.style.left = `${coords.x}px`;
        el.style.top = `${coords.y}px`;

        if (state.isBuilding) {
          let fDrag = false, fOffset = { x: 0, y: 0 };
          el.addEventListener('pointerdown', (e) => {
            fDrag = true;
            fOffset.x = e.clientX - coords.x;
            fOffset.y = e.clientY - coords.y;
            el.setPointerCapture(e.pointerId);
          });
          el.addEventListener('pointermove', (e) => {
            if (!fDrag) return;
            coords.x = e.clientX - fOffset.x;
            coords.y = Math.max(window.innerHeight * 0.55, Math.min(window.innerHeight * 0.82, e.clientY - fOffset.y));
            el.style.left = `${coords.x}px`;
            el.style.top = `${coords.y}px`;
          });
          el.addEventListener('pointerup', () => { fDrag = false; saveGame(); });
        }
        furnitureLayer.appendChild(el);
      });
    }

    // 6. 換衣服衣櫥
    function openWardrobe() {
      const grid = document.getElementById('wardrobeGrid');
      grid.innerHTML = '';
      const currentHamster = state.hamsters.find(h => h.id === state.currentFocusId) || state.hamsters[0];
      const hatIds = state.inventory.filter(id => ASSETS.hats[id]);

      hatIds.forEach(id => {
        const item = ASSETS.hats[id];
        const isEquipped = currentHamster.equippedHat === id;
        const card = document.createElement('div');
        card.className = 'card-item';
        card.innerHTML = `
          <div class="preview-box">${item.svg}</div>
          <b>${item.name}</b>
          <button class="btn-action" style="padding:6px; margin-top:4px;" onclick="toggleHat('${id}')">
            ${isEquipped ? '卸下' : '穿上'}
          </button>
        `;
        grid.appendChild(card);
      });
      document.getElementById('wardrobeModal').style.display = 'flex';
    }

    function toggleHat(id) {
      const currentHamster = state.hamsters.find(h => h.id === state.currentFocusId) || state.hamsters[0];
      currentHamster.equippedHat = (currentHamster.equippedHat === id) ? null : id;
      saveGame();
      renderHamsters();
      openWardrobe();
    }

    // 7. 商店系統 (海量商品)
    function openShop() {
      document.getElementById('shopCoinText').textContent = state.coins;
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';

      // 帽子飾品
      Object.keys(ASSETS.hats).forEach(id => {
        if (!state.inventory.includes(id)) {
          const item = ASSETS.hats[id];
          renderShopCard(grid, item, () => buyItem(id, 'hat', item.cost));
        }
      });
      // 家具
      Object.keys(ASSETS.furniture).forEach(id => {
        if (!state.inventory.includes(id)) {
          const item = ASSETS.furniture[id];
          renderShopCard(grid, item, () => buyItem(id, 'furniture', item.cost));
        }
      });
      document.getElementById('shopModal').style.display = 'flex';
    }

    function renderShopCard(container, item, onBuy) {
      const card = document.createElement('div');
      card.className = 'card-item';
      card.innerHTML = `
        <div class="preview-box">${item.svg}</div>
        <b>${item.name}</b>
        <span>🪙 ${item.cost} 幣</span>
      `;
      const btn = document.createElement('button');
      btn.className = 'btn-action';
      btn.style.cssText = 'padding:6px; margin-top:4px;';
      btn.textContent = '購買';
      btn.onclick = onBuy;
      card.appendChild(btn);
      container.appendChild(card);
    }

    function buyItem(id, type, cost) {
      if (state.coins < cost) {
        alert('金幣不足！快去玩小遊戲接金幣吧！');
        return;
      }
      state.coins -= cost;
      state.inventory.push(id);
      if (type === 'furniture') {
        const item = ASSETS.furniture[id];
        state.furnitureCoords[id] = { x: item.defaultX, y: window.innerHeight * item.defaultY };
        renderFurniture();
      }
      saveGame();
      renderHUD();
      alert('購買成功，已放入你的清單！');
      openShop();
    }

    // 8. 外出旅行與明信片手帳
    function openPostcardBook() {
      const list = document.getElementById('postcardList');
      const empty = document.getElementById('postcardEmpty');
      list.innerHTML = '';

      if (state.postcards.length === 0) {
        empty.style.display = 'block';
      } else {
        empty.style.display = 'none';
        state.postcards.forEach(card => {
          const row = document.createElement('div');
          row.style.cssText = 'background:#fff; border:1px solid var(--border-color); border-radius:16px; padding:12px; margin-bottom:10px; display:flex; gap:12px; align-items:center;';
          row.innerHTML = `
            <div style="width:70px; height:70px; flex-shrink:0; background:#faf4ed; border-radius:10px; display:flex; align-items:center; justify-content:center;">${card.svg}</div>
            <div style="font-size:12px; color:var(--main-text); line-height:1.5;">
              <b style="font-size:14px;">${card.title}</b>
              <p>${card.desc}</p>
            </div>
          `;
          list.appendChild(row);
        });
      }
      document.getElementById('postcardModal').style.display = 'flex';
    }

    function sendPetToTravel() {
      if (state.isTraveling) return;
      closeModal('postcardModal');
      state.isTraveling = true;
      hamsterLayer.style.display = 'none';
      alert('鼠鼠背起小書包出門旅行了！8 秒後會寄明信片回來～');

      setTimeout(() => {
        state.isTraveling = false;
        hamsterLayer.style.display = 'block';

        const keys = Object.keys(ASSETS.postcards);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        const cardData = ASSETS.postcards[randomKey];

        if (!state.postcards.some(p => p.title === cardData.title)) {
          state.postcards.push(cardData);
        }
        state.coins += 50;
        saveGame();
        renderHUD();
        alert(`叮咚！鼠鼠寄回了一張【${cardData.title}】明信片，還賺了 50 金幣！`);
      }, 8000);
    }

    // 9. 小遊戲系統與明確規則提示
    function showMiniGameIntro() {
      document.getElementById('rulesModal').style.display = 'flex';
    }

    const gameScreen = document.getElementById('minigame-screen');
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    let loopId, timerId, gScore = 0, gTime = 20;
    let basket = { x: 0, y: 0, w: 60, h: 50 };
    let drops = [];

    function reallyStartMiniGame() {
      closeModal('rulesModal');
      gameScreen.style.display = 'block';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      basket.x = canvas.width / 2 - 30;
      basket.y = canvas.height - 110;
      gScore = 0;
      gTime = 20;
      drops = [];
      document.getElementById('gameScore').textContent = gScore;
      document.getElementById('gameTimer').textContent = gTime;

      canvas.ontouchmove = (e) => { basket.x = e.touches[0].clientX - basket.w / 2; };
      canvas.onmousemove = (e) => { basket.x = e.clientX - basket.w / 2; };

      timerId = setInterval(() => {
        gTime--;
        document.getElementById('gameTimer').textContent = gTime;
        if (gTime <= 0) finishMiniGame();
      }, 1000);

      runGame();
    }

    function runGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (Math.random() < 0.08) {
        drops.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -20,
          speed: 3 + Math.random() * 3,
          isCoin: Math.random() < 0.45,
          isRock: Math.random() < 0.2
        });
      }

      // 接物推車
      ctx.fillStyle = '#e8a86b';
      ctx.beginPath();
      ctx.arc(basket.x + 30, basket.y + 25, 24, 0, Math.PI * 2);
      ctx.fill();

      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.y += d.speed;

        if (d.isRock) {
          ctx.fillStyle = '#6c757d';
          ctx.beginPath();
          ctx.arc(d.x, d.y, 11, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.isCoin) {
          ctx.fillStyle = '#ffd166';
          ctx.beginPath();
          ctx.arc(d.x, d.y, 10, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#5a4b3d';
          ctx.beginPath();
          ctx.ellipse(d.x, d.y, 6, 10, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 碰撞檢測
        if (d.y > basket.y && d.y < basket.y + basket.h && d.x > basket.x && d.x < basket.x + basket.w) {
          if (d.isRock) gScore = Math.max(0, gScore - 10);
          else if (d.isCoin) gScore += 15;
          else gScore += 5;
          document.getElementById('gameScore').textContent = gScore;
          drops.splice(i, 1);
          continue;
        }
        if (d.y > canvas.height) drops.splice(i, 1);
      }
      loopId = requestAnimationFrame(runGame);
    }

    function finishMiniGame() {
      cancelAnimationFrame(loopId);
      clearInterval(timerId);
      gameScreen.style.display = 'none';

      const earned = Math.floor(gScore / 2);
      state.coins += earned;
      saveGame();
      renderHUD();
      alert(`挑戰結束！你獲得了 ${gScore} 分，兌換為 🪙 ${earned} 枚金幣！`);
    }

    // 10. UI 狀態更新與導覽列收合
    function toggleDock() {
      const d = document.getElementById('mainDock');
      const b = document.getElementById('dockToggleBtn');
      if (d.classList.contains('collapsed')) {
        d.classList.remove('collapsed');
        b.textContent = '收';
      } else {
        d.classList.add('collapsed');
        b.textContent = '展';
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function renderHUD() {
      document.getElementById('valCoins').textContent = state.coins;
      document.getElementById('valHamsterCount').textContent = state.hamsters.length;
    }

    // 頁面初次載入
    renderFurniture();
    renderHamsters();
    renderHUD();
  </script>
</body>
</html>
